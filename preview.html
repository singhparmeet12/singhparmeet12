<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parmeet Singh — Personal Webpage & Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #EDF1E8;
      --card-bg: #FBFCF8;
      --border-subtle: #DCE8D8;
      --text-dark: #18231A;
      --text-muted: #657066;
      --primary-green: #4F7F5B;
      --deep-green: #24452E;
      --soft-sage: #EAF2E8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      padding: 30px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(79, 127, 91, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(79, 127, 91, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .page-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      text-align: center;
      margin-bottom: -4px;
    }

    .avatar-wrapper img {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto;
    }

    .canvas-panel {
      width: 100%;
      display: block;
    }

    .hero-btn-row, .connect-btn-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .bento-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
    }

    .bento-card-link {
      flex: 1;
      display: block;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .bento-card-link:hover {
      transform: translateY(-2px);
    }

    .bento-card-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    .project-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 2px;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .project-links a {
      color: var(--primary-green);
      text-decoration: none;
      font-weight: 600;
    }

    .project-links a:hover {
      text-decoration: underline;
      color: var(--deep-green);
    }

    .footer-actions {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .footer-actions a {
      color: var(--deep-green);
      text-decoration: none;
      margin: 0 8px;
      font-weight: 600;
    }

    .footer-actions a:hover {
      text-decoration: underline;
      color: var(--primary-green);
    }

    .footer-sub {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <main class="page-container">
    
    <!-- 01 Waving Hand -->
    <div class="avatar-wrapper">
      <a href="https://github.com/singhparmeet12" title="Hello from Parmeet!">

      </a>

    <!-- 02 Hero Banner with Floating Parmeet Avatar -->

    <!-- Hero Action Buttons -->
    <div class="hero-btn-row">

      </a>
      <a href="mailto:parmeetssms@gmail.com">

      <span style="color: #9DB89B;">•</span>
      <a href="https://github.com/singhparmeet12/TourCraze" target="_blank">TourCraze Repo ↗</a>
      <span style="color: #9DB89B;">|</span>

      <span style="color: #9DB89B;">|</span>
      <a href="https://personal-portfolio-parmeet1.vercel.app/" target="_blank">04 Portfolio Live ↗</a>

    <!-- 04 Skills & Toolkit -->

    <!-- 05 Connect Header -->

    <!-- Connect Action Chips -->
    <div class="connect-btn-row">
      <a href="https://personal-portfolio-parmeet1.vercel.app/resume/download/" target="_blank">
        <img src="./assets/chip-resume.svg" height="42" alt="View Resume (PDF)" />
      </a>
      <a href="https://linkedin.com/in/parmeetsingh12" target="_blank">
        <img src="./assets/chip-linkedin.svg" height="42" alt="LinkedIn" />
      </a>
      <a href="mailto:parmeetssms@gmail.com">

    <div class="footer-actions">
      <a href="https://personal-portfolio-parmeet1.vercel.app/resume/download/" target="_blank">📄 VIEW RESUME (PDF) ↗</a> &bull;
      <a href="https://linkedin.com/in/parmeetsingh12" target="_blank">LinkedIn ↗</a> &bull;

    </div>

  </main>

</body>
</html>
