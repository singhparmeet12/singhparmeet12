<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parmeet Singh — Living Digital Canvas (GitHub Profile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #EDF1E8;
      --canvas-bg: #F6F8F3;
      --border-subtle: #DCE8D8;
      --text-dark: #18231A;
      --text-muted: #657066;
      --primary-green: #4F7F5B;
      --deep-green: #24452E;
      --soft-sage: #DCE8D8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      padding: 30px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ambient background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(79, 127, 91, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(79, 127, 91, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Top Preview Header */
    .preview-header-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      margin-bottom: 24px;
      padding: 12px 20px;
      background: rgba(251, 252, 248, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(36, 69, 46, 0.05);
    }

    .preview-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--deep-green);
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-green);
      box-shadow: 0 0 8px var(--primary-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #EAF2E8;
      color: var(--deep-green);
      border: 1px solid #DCE8D8;
      border-radius: 6px;
      padding: 6px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: var(--primary-green);
      color: #FFFFFF;
      border-color: var(--primary-green);
    }

    /* THE CONTINUOUS LIVING CANVAS CONTAINER */
    .continuous-canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      background: var(--canvas-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 
        0 10px 40px rgba(36, 69, 46, 0.08),
        0 1px 3px rgba(36, 69, 46, 0.04);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
    }

    /* Seamless panels - zero margins, zero borders, edge-to-edge flow */
    .canvas-panel {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .canvas-panel svg,
    .canvas-panel img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
    }

    .canvas-link {
      display: block;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .canvas-link:hover {
      opacity: 0.97;
    }

    /* Footer Direct Links */
    .canvas-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      margin-top: 24px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .footer-links a {
      color: var(--deep-green);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(251, 252, 248, 0.7);
      border: 1px solid var(--border-subtle);
      transition: all 0.2s ease;
    }

    .footer-links a:hover {
      background: var(--primary-green);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Top preview control -->
  <div class="preview-header-bar">
    <div class="preview-title">
      <div class="status-pulse"></div>
      <span>PARMEET SINGH &bull; CONTINUOUS DIGITAL CANVAS</span>

    <div class="preview-actions">
      <a href="https://github.com/singhparmeet12" target="_blank" class="btn-action">↗ GitHub Profile</a>

    </div>
  </div>

  <!-- THE CONTINUOUS CANVAS -->
  <main class="continuous-canvas">
    
    <!-- 01 HERO -->

      </a>
    </div>

    <!-- 04 PROJECT: GAADIMANDI -->

      </a>

    <!-- 05 PROJECT: TOURCRAZE -->
    <div class="canvas-panel">

      </a>
    </div>

    <!-- 06 ABILITIES -->
    <div class="canvas-panel">
      <img src="./assets/canvas-06-abilities.svg" alt="06 Technical Stack & Disciplines" />
    </div>

    <!-- 07 ACTIVITY -->
    <div class="canvas-panel">
      <img src="./assets/canvas-07-activity.svg" alt="07 Activity Streams & Telemetry" />
    </div>

    <!-- 08 CONNECT -->
    <div class="canvas-panel">
      <img src="./assets/canvas-08-connect.svg" alt="08 Connect & Contact" />
    </div>

  </main>

  <!-- Interactive Footer Navigation -->
  <footer class="canvas-footer">
    <div class="footer-links">
      <a href="https://github.com/singhparmeet12" target="_blank">GitHub ↗</a>
      <a href="https://linkedin.com/in/parmeetsingh12" target="_blank">LinkedIn ↗</a>
      <a href="https://personal-portfolio-parmeet1.vercel.app/" target="_blank">Personal Portfolio ↗</a>
      <a href="mailto:parmeetssms@gmail.com">parmeetssms@gmail.com ↗</a>
    </div>
    <div>PARMEET SINGH &bull; FULL-STACK DEVELOPER &bull; LIVING DIGITAL CANVAS &bull; 2026</div>
  </footer>

</body>
</html>
