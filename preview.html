<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parmeet Singh — Personal Webpage & Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #EDF1E8;
      --card-bg: #FBFCF8;
      --border-subtle: #DCE8D8;
      --text-dark: #18231A;
      --text-muted: #657066;
      --primary-green: #4F7F5B;
      --deep-green: #24452E;
      --soft-sage: #EAF2E8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      padding: 40px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Subtle ambient grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(79, 127, 91, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(79, 127, 91, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Container for continuous personal page */
    .page-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Greeting Header */
    .avatar-wrapper {
      text-align: center;
      margin-bottom: -6px;
    }

    .avatar-wrapper img {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto;
    }

    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      border: 1.5px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(36, 69, 46, 0.06);
    }

    .project-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .project-card-link {
      display: block;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .project-card-link:hover {
      transform: translateY(-2px);
      opacity: 0.98;
    }

    .project-links {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .project-links a {
      color: var(--primary-green);
      text-decoration: none;
      font-weight: 600;
    }

    .project-links a:hover {
      text-decoration: underline;
      color: var(--deep-green);
    }

    .footer-actions {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
    }

    .footer-actions a {
      color: var(--deep-green);
      text-decoration: none;
      margin: 0 8px;
      font-weight: 600;
    }

    .footer-actions a:hover {
      text-decoration: underline;
      color: var(--primary-green);
    }

    .footer-sub {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <main class="page-container">
    
    <!-- Animated Hello Waving Hand -->
    <div class="avatar-wrapper">
      <a href="https://github.com/singhparmeet12" title="Hello from Parmeet!">
        <img src="./assets/waving-hand.gif" alt="Friendly Waving Hand" />
      </a>
    </div>

    <!-- Greeting Banner -->
    <img src="./assets/greeting.svg" alt="Hey there, I'm Parmeet" style="width: 100%; display: block;" />

    <!-- Cozy Lofi Workspace Banner -->
    <img src="./assets/lofi-workspace.jpg" alt="Parmeet's Cozy Lofi Workspace" class="banner-img" />

    <!-- Project 01: TradeLab -->
    <div class="project-wrapper">
      <a href="https://tradelab-kappa.vercel.app/" target="_blank" class="project-card-link">
        <img src="./assets/card-01-tradelab.svg" alt="01 TradeLab" style="width: 100%; display: block;" />
      </a>
      <div class="project-links">
        <a href="https://tradelab-kappa.vercel.app/" target="_blank">↗ View Live Demo</a>
        <span style="color: #9DB89B;">•</span>
        <a href="https://github.com/singhparmeet12/TradeLab" target="_blank">↗ GitHub Repository</a>
      </div>
    </div>

    <!-- Project 02: TourCraze -->
    <div class="project-wrapper">
      <a href="https://tour-craze.vercel.app/" target="_blank" class="project-card-link">
        <img src="./assets/card-02-tourcraze.svg" alt="02 TourCraze" style="width: 100%; display: block;" />
      </a>
      <div class="project-links">
        <a href="https://tour-craze.vercel.app/" target="_blank">↗ View Live Demo</a>
        <span style="color: #9DB89B;">•</span>
        <a href="https://github.com/singhparmeet12/TourCraze" target="_blank">↗ GitHub Repository</a>
      </div>
    </div>

    <!-- Project 03: GaadiMandi -->
    <div class="project-wrapper">
      <a href="https://car-trade-gamma.vercel.app/" target="_blank" class="project-card-link">
        <img src="./assets/card-03-gaadimandi.svg" alt="03 GaadiMandi" style="width: 100%; display: block;" />
      </a>
      <div class="project-links">
        <a href="https://car-trade-gamma.vercel.app/" target="_blank">↗ View Live Demo</a>
      </div>
    </div>

    <!-- Project 04: Personal Portfolio -->
    <div class="project-wrapper">
      <a href="https://personal-portfolio-parmeet1.vercel.app/" target="_blank" class="project-card-link">
        <img src="./assets/card-04-portfolio.svg" alt="04 Personal Portfolio" style="width: 100%; display: block;" />
      </a>
      <div class="project-links">
        <a href="https://personal-portfolio-parmeet1.vercel.app/" target="_blank">↗ View Live Site</a>
        <span style="color: #9DB89B;">•</span>
        <a href="https://github.com/singhparmeet12/Personal-Portfolio" target="_blank">↗ GitHub Repository</a>
      </div>
    </div>

    <!-- Skills & Tools -->
    <img src="./assets/skills.svg" alt="Toolkit & Craft" style="width: 100%; display: block;" />

    <!-- Connect & Resume -->
    <a href="https://personal-portfolio-parmeet1.vercel.app/resume/download/" target="_blank" class="project-card-link" style="width: 100%;">
      <img src="./assets/connect.svg" alt="Let's Connect" style="width: 100%; display: block;" />
    </a>

    <!-- Direct Links -->
    <div class="footer-actions">
      <a href="https://personal-portfolio-parmeet1.vercel.app/resume/download/" target="_blank">📄 VIEW RESUME (PDF) ↗</a> &bull;
      <a href="https://linkedin.com/in/parmeetsingh12" target="_blank">LinkedIn ↗</a> &bull;
      <a href="mailto:parmeetssms@gmail.com">parmeetssms@gmail.com ↗</a> &bull;
      <a href="https://personal-portfolio-parmeet1.vercel.app/" target="_blank">Personal Portfolio ↗</a>
      <div class="footer-sub">PARMEET SINGH &bull; FULL-STACK DEVELOPER &bull; DELHI, INDIA</div>
    </div>

  </main>

</body>
</html>
