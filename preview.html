    * { margin: 0; padding: 0; box-sizing: border-box; }

      background: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      min-height: 100vh;
      transition: background 0.3s ease;
    }
    .mode-switch {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }
    .mode-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      background: #f6f8fa;
    }
    .github-canvas {
      max-width: 880px;
      width: 100%;
      text-align: center;
      line-height: 1.5;
      font-size: 16px;
    }
    .github-canvas img {
      box-sizing: content-box;
      max-width: 100%;
    }
    .github-canvas a {
      text-decoration: none;
    }
  </style>
</head>
