<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 40" width="148" height="40">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="gl"/>
      <feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1.5" y="1.5" width="145" height="37" rx="18.5" fill="#161b22" stroke="#39FF14" stroke-width="1.5" filter="url(#g)">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="74" y="25" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">View Resume</text>
</svg>