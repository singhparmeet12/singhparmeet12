<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="880" height="44">
  <defs>
    <style>
      .label-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #4F7F5B;
        letter-spacing: 0.16em;
      }
      .sec-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #657066;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- Pulsing Radar Dot -->
  <circle cx="16" cy="22" r="4" fill="#4F7F5B">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="22" r="8" fill="none" stroke="#4F7F5B" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="34" y="26" class="label-mono">SELECTED WORK &#8226; CLICK ANY CARD TO LAUNCH DEMO</text>
  <text x="864" y="26" class="sec-sub" text-anchor="end">4 LIVE PLATFORMS &#8599;</text>
</svg>
