<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 145" width="880" height="145">
  <defs>
    <style>
      .num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 700;
        fill: #9DB89B;
        letter-spacing: -0.05em;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.02em;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 400;
        fill: #657066;
      }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #4F7F5B;
      }
      .cta-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.05em;
      }
    </style>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFCF8"/>
      <stop offset="100%" stop-color="#F4F7F1"/>
    </linearGradient>
  </defs>

  <!-- Continuous Flow Line In -->
  <line x1="440" y1="0" x2="440" y2="12" stroke="#4F7F5B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Card Surface -->
  <rect x="0" y="12" width="880" height="120" rx="16" fill="url(#cardGrad2)" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Left: Number & Project Info -->
  <text x="32" y="65" class="num">02</text>
  <text x="86" y="52" class="title">TOURCRAZE</text>
  <text x="86" y="74" class="desc">A full-stack travel planner and group expense manager with TripSplit settlement.</text>
  <text x="86" y="98" class="tag">STACK &#8226; Django &#8226; Python &#8226; JavaScript &#8226; Graph Logic</text>

  <!-- Right: Stylized Mini Route/Settlement Graph Motif & CTA -->
  <g transform="translate(680, 42)">
    <!-- Mini Graph motif -->
    <circle cx="12" cy="18" r="4" fill="#4F7F5B"/>
    <circle cx="38" cy="10" r="4" fill="#4F7F5B"/>
    <circle cx="28" cy="36" r="4" fill="#9DB89B"/>
    <line x1="12" y1="18" x2="38" y2="10" stroke="#4F7F5B" stroke-width="1.5"/>
    <line x1="12" y1="18" x2="28" y2="36" stroke="#9DB89B" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="38" y1="10" x2="28" y2="36" stroke="#4F7F5B" stroke-width="1.5"/>

    <!-- CTA Button -->
    <g transform="translate(60, 10)">
      <rect x="0" y="0" width="124" height="34" rx="8" fill="#24452E"/>
      <text x="62" y="21" class="cta-txt" text-anchor="middle">VIEW PROJECT &#8594;</text>
    </g>
  </g>

  <!-- Continuous Flow Line Out -->
  <line x1="440" y1="132" x2="440" y2="145" stroke="#4F7F5B" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
