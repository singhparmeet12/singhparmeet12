<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 205" width="430" height="205">
  <defs>
    <filter id="cardGlow_02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    @keyframes radarPing_02 {
      0% { r: 3; opacity: 1; }
      70% { r: 7; opacity: 0; }
      100% { r: 7; opacity: 0; }
    }
    .radar-pulse { animation: radarPing_02 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    @keyframes borderPulse_02 {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .glow-border { animation: borderPulse_02 3s ease-in-out infinite; }
  ]]></style>

  <!-- Card Surface (Doodle Notebook Card) -->
  <rect x="3" y="3" width="424" height="199" rx="16" fill="#121820"/>

  <!-- Sketched Doodle Neon Border -->
  <rect x="3" y="3" width="424" height="199" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.5" class="glow-border" filter="url(#cardGlow_02)"/>

  <!-- Left Accent Notch -->
  <rect x="3" y="28" width="4" height="145" rx="2" fill="#00F0FF"/>

  <!-- Top Notebook Tape Header Accent -->
  <polygon points="25,3 110,3 105,14 20,14" fill="#00F0FF" opacity="0.25"/>

  <!-- Status Beacon Badge (Right aligned) -->
  <g transform="translate(290, 18)">
    <rect x="0" y="0" width="122" height="22" rx="11" fill="#0d1117" stroke="#00F0FF" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#00F0FF"/>
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#00F0FF" stroke-width="1.5" class="radar-pulse"/>
    <text x="24" y="15" class="mono" font-size="9" font-weight="700" fill="#00F0FF" letter-spacing="0.5">● LIVE PLATFORM</text>
  </g>

  <!-- Project Number & Category -->
  <text x="22" y="44" class="mono" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1">02 // SMART TRAVEL BOOKING</text>

  <!-- Project Title (Size 26: never collides with badge) -->
  <text x="22" y="74" class="doodle-hand" font-size="26" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">TourCraze</text>

  <!-- 2 Clean Short Lines: Never Out of Box, Zero Overlap -->
  <text x="22" y="103" class="doodle-hand" font-size="16" fill="#8b949e">AI-powered smart travel planning platform</text>
  <text x="22" y="125" class="doodle-hand" font-size="16" fill="#8b949e">with curated tours &amp; instant booking.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 143)">
    <text x="0" y="11" class="mono" font-size="11.5" font-weight="600" fill="#00F0FF" opacity="0.88">React • Express • MongoDB • Tailwind</text>
  </g>

  <!-- Launch Prompt Bar (Click Card To Launch) -->
  <g transform="translate(22, 166)">
    <rect x="0" y="0" width="386" height="25" rx="7" fill="#0d1117" stroke="#00F0FF" stroke-width="1" opacity="0.9"/>
    <text x="193" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#00F0FF" letter-spacing="1">
      CLICK CARD TO LAUNCH LIVE APP ↗
    </text>
  </g>
</svg>