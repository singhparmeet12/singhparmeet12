<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170">
  <defs>
    
  <defs>
    <!-- Notebook Graph Grid Pattern -->
    <pattern id="notebookGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14231b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="12" cy="12" r="0.6" fill="#00FF66" opacity="0.25"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.65" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="color" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#00F0FF;#00FF66" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Avatar Glow -->
    <radialGradient id="avatarBackdropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

    <filter id="cardGlow_02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    @keyframes radarPing_02 {
      0% { r: 3; opacity: 1; }
      70% { r: 7; opacity: 0; }
      100% { r: 7; opacity: 0; }
    }
    .radar-pulse { animation: radarPing_02 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    @keyframes borderPulse_02 {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .glow-border { animation: borderPulse_02 3s ease-in-out infinite; }
  ]]></style>

  <!-- Full-bleed outer dark canvas (Tiles seamlessly to 880px) -->
  <rect width="440" height="170" fill="#0d1117"/>
  <rect width="440" height="170" fill="url(#notebookGrid)"/>
  

  <!-- Card Surface (Doodle Notebook Card, width 372px) -->
  <rect x="10" y="3" width="372" height="164" rx="16" fill="#121820"/>

  <!-- Sketched Doodle Neon Border -->
  <rect x="10" y="3" width="372" height="164" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.5" class="glow-border" filter="url(#cardGlow_02)"/>

  <!-- Left Accent Notch -->
  <rect x="10" y="26" width="4" height="118" rx="2" fill="#00F0FF"/>

  <!-- Top Notebook Tape Header Accent -->
  <polygon points="28,3 113,3 108,14 23,14" fill="#00F0FF" opacity="0.25"/>

  <!-- Status Beacon Badge (Right aligned) -->
  <g transform="translate(248, 16)">
    <rect x="0" y="0" width="122" height="22" rx="11" fill="#0d1117" stroke="#00F0FF" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#00F0FF"/>
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#00F0FF" stroke-width="1.5" class="radar-pulse"/>
    <text x="24" y="15" class="mono" font-size="9" font-weight="700" fill="#00F0FF" letter-spacing="0.5">● LIVE PLATFORM</text>
  </g>

  <!-- Project Number & Category -->
  <text x="28" y="38" class="mono" font-size="11.5" font-weight="700" fill="#00F0FF" letter-spacing="1">02 // TRAVEL &amp; TOUR BOOKING</text>

  <!-- Project Title -->
  <text x="28" y="68" class="doodle-hand" font-size="26" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">
    TourCraze
  </text>

  <!-- Custom Glowing NEON Vector Doodle Icon (Generous safe spacing: ZERO text overlap!) -->
  <g transform="translate(210, 53)">
    
          <!-- Glowing Neon Electric Cyan Supersonic Jet Doodle -->
          <path d="M -6,13 Q 3,11 10,6" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.75"/>
          <polygon points="12,-3 30,2 16,13 15,6" fill="#0d1117" stroke="#00F0FF" stroke-width="1.8" stroke-linejoin="round" filter="url(#softGlow)"/>
          <polygon points="12,-3 30,2 16,13 15,6" fill="#00F0FF" opacity="0.3"/>
          <line x1="12" y1="-3" x2="16" y2="13" stroke="#00F0FF" stroke-width="1.2"/>
        
  </g>

  <!-- 2 Clean Short Lines: Generous Space, Zero Overlap -->
  <text x="28" y="98" class="doodle-hand" font-size="15.5" fill="#8b949e">Travel discovery platform featuring</text>
  <text x="28" y="120" class="doodle-hand" font-size="15.5" fill="#8b949e">curated tours &amp; itinerary booking.</text>

  <!-- Tech Stack Pills (Real stack: Python & Django based, max 4 skills!) -->
  <g transform="translate(28, 143)">
    <text x="0" y="11" class="mono" font-size="11" font-weight="600" fill="#00F0FF" opacity="0.88">Python • Django • PostgreSQL • Tailwind</text>
  </g>
</svg>