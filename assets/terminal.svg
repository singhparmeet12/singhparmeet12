<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8" />
      <stop offset="100%" stop-color="#EEF6F1" />
    </linearGradient>

    <style>
      @keyframes blinkTerm {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink {
        animation: blinkTerm 1.1s infinite;
      }
      .term-font {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        font-size: 12.5px;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="716" height="196" rx="10" fill="url(#termBg)" stroke="#D0E6D6" stroke-width="1.2" />

  <!-- Window Top Bar -->
  <rect x="2" y="2" width="716" height="30" rx="10" fill="#E4F2E8" />
  <rect x="2" y="22" width="716" height="10" fill="#E4F2E8" />
  <line x1="2" y1="32" x2="718" y2="32" stroke="#D0E6D6" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="4.5" fill="#D5E8D9" stroke="#97CEAA" stroke-width="1" />
  <circle cx="35" cy="17" r="4.5" fill="#97CEAA" stroke="#40C463" stroke-width="1" />
  <circle cx="50" cy="17" r="4.5" fill="#2DA44E" stroke="#146B32" stroke-width="1" />

  <text x="360" y="20.5" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#607064" text-anchor="middle">
    parmeet@workstation: ~/session &#8226; zsh
  </text>

  <!-- Terminal Session Commands & Outputs -->
  <g transform="translate(24, 58)" class="term-font">
    
    <!-- Command 1: whoami -->
    <text x="0" y="0">
      <tspan fill="#2DA44E" font-weight="700">$</tspan> <tspan fill="#146B32" font-weight="600">whoami</tspan>
    </text>
    <text x="0" y="18" fill="#607064">
      parmeet_singh // full-stack developer
    </text>

    <!-- Command 2: focus -->
    <text x="0" y="44">
      <tspan fill="#2DA44E" font-weight="700">$</tspan> <tspan fill="#146B32" font-weight="600">focus</tspan>
    </text>
    <text x="0" y="62" fill="#607064">
      full-stack &#8226; scalable-data &#8226; computer-vision &#8226; digital-craft
    </text>

    <!-- Command 3: status -->
    <text x="0" y="88">
      <tspan fill="#2DA44E" font-weight="700">$</tspan> <tspan fill="#146B32" font-weight="600">status</tspan>
    </text>
    <text x="0" y="106">
      <tspan fill="#17231A" font-weight="600">building &amp; flourishing</tspan>
      <tspan fill="#2DA44E" font-weight="700" class="cursor-blink"> ▋</tspan>
    </text>

  </g>
</svg>
