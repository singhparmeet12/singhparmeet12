<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 45" width="880" height="45">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#1a3a1a" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="880" height="45" fill="#0d1117"/>
  <rect width="880" height="45" fill="url(#dots)"/>
  <line x1="240" y1="5" x2="640" y2="5" stroke="#1a3a1a" stroke-width="0.5" opacity="0.5"/>
  <text x="440" y="30" text-anchor="middle" font-family="'Consolas', 'SF Mono', 'Fira Code', monospace" font-size="11" fill="#484f58" letter-spacing="2" opacity="0.6">PARMEET SINGH  ·  FULL-STACK DEVELOPER  ·  DELHI, INDIA</text>
</svg>