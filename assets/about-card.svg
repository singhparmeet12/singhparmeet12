<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="abtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8" />
      <stop offset="100%" stop-color="#EEF6F1" />
    </linearGradient>

    <style>
      .mono-a { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans-a { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="876" height="136" rx="12" fill="url(#abtBg)" stroke="#D4E7D9" stroke-width="1.2" />

  <!-- Left Column: Vision & Philosophy -->
  <g transform="translate(32, 24)">
    <text x="0" y="10" class="mono-a" font-size="10.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      // 01 ARCHITECTURE &amp; CRAFT
    </text>
    <g transform="translate(0, 32)" class="sans-a" font-size="12.5" fill="#3D4E41" line-height="1.55">
      <text x="0" y="0">I engineer full-stack web platforms, clean database schemas,</text>
      <text x="0" y="20">and intuitive digital experiences. My work connects robust</text>
      <text x="0" y="40">Python &amp; Django backends with algorithmic systems and AI.</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="450" y1="20" x2="450" y2="116" stroke="#D7EBDE" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Right Column: Focus Areas -->
  <g transform="translate(480, 24)">
    <text x="0" y="10" class="mono-a" font-size="10.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      // 02 CORE EXPLORATIONS
    </text>
    <g transform="translate(0, 32)" class="sans-a" font-size="12" fill="#17231A">
      <text x="0" y="0"><tspan fill="#2DA44E">&bull;</tspan> Scalable Django 5.x architectures &amp; PostgreSQL query tuning</text>
      <text x="0" y="20"><tspan fill="#2DA44E">&bull;</tspan> Applied computer vision (YOLOv5) &amp; financial chart pattern recognition</text>
      <text x="0" y="40"><tspan fill="#2DA44E">&bull;</tspan> Greedy debt-simplification algorithms &amp; asynchronous UI pipelines</text>
    </g>
  </g>
</svg>
