<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96">
  <defs>
    <style>
      .label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #4F7F5B;
        letter-spacing: 0.18em;
      }
      .heading {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.02em;
      }
      .subtext {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #657066;
      }
    </style>
    <linearGradient id="connectHdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFCF8"/>
      <stop offset="100%" stop-color="#F4F7F1"/>
    </linearGradient>
  </defs>

  <!-- Continuous Flow Line In -->
  <line x1="440" y1="0" x2="440" y2="12" stroke="#4F7F5B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Card Surface -->
  <rect x="0" y="12" width="880" height="82" rx="16" fill="url(#connectHdrBg)" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Info -->
  <text x="36" y="38" class="label">REACH OUT &amp; CONNECT</text>
  <text x="36" y="62" class="heading">Let&#8217;s build something great.</text>
  <text x="36" y="82" class="subtext">Currently open for full-stack engineering roles, creative collaborations, and high-impact web projects.</text>
</svg>
