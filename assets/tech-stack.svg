<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" width="880" height="265">
  
  <defs>
    <!-- Notebook Graph Grid Pattern -->
    <pattern id="notebookGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14231b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="12" cy="12" r="0.6" fill="#00FF66" opacity="0.25"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="color" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#00F0FF;#00FF66" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Avatar Glow -->
    <radialGradient id="avatarBackdropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1deg); }
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-2deg); }
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes floatWobble {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes steamRise {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.15); }
      60% { transform: scale(0.95); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNeon {
      0%, 100% { opacity: 0.55; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.2; }
    }
    @keyframes radarPing {
      0% { r: 3; opacity: 1; }
      70% { r: 8; opacity: 0; }
      100% { r: 8; opacity: 0; }
    }
    @keyframes starTwinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -32; }
    }
    .floating-avatar { animation: floatAvatar 4.5s ease-in-out infinite; transform-origin: center; }
    .float-gentle { animation: floatGentle 4s ease-in-out infinite; transform-origin: center; }
    .float-bob { animation: floatBob 3.6s ease-in-out infinite; transform-origin: center; }
    .float-wobble { animation: floatWobble 4.2s ease-in-out infinite; transform-origin: center; }
    .steam-1 { animation: steamRise 2.2s linear infinite; }
    .steam-2 { animation: steamRise 2.2s linear infinite 0.7s; }
    .steam-3 { animation: steamRise 2.2s linear infinite 1.4s; }
    .heart-pulse { animation: heartBeat 1.8s ease-in-out infinite; transform-origin: center; }
    .cursor-blink { animation: blinkCursor 0.9s infinite; }
    .pulse-glow { animation: pulseNeon 2.8s ease-in-out infinite; }
    .radar-pulse { animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .star-1 { animation: starTwinkle 2.5s ease-in-out infinite; transform-origin: center; }
    .star-2 { animation: starTwinkle 2.5s ease-in-out infinite 1.2s; transform-origin: center; }
    .connecting-line { stroke-dasharray: 6, 6; animation: dashTravel 2s linear infinite; }
  ]]></style>


  <!-- Background -->
  <rect width="880" height="265" fill="#0d1117"/>
  <rect width="880" height="265" fill="url(#notebookGrid)"/>

  <!-- Continuous Flow Line from Top -->
  <line x1="440" y1="0" x2="440" y2="28" stroke="#00FF66" stroke-width="2" stroke-dasharray="4,4" class="connecting-line"/>
  <circle cx="440" cy="28" r="4" fill="#00FF66" filter="url(#softGlow)"/>

  <!-- Section Title Badge -->
  <g transform="translate(290, 38)">
    <rect x="0" y="0" width="300" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="150" y="24" text-anchor="middle" class="doodle-hand" font-size="21" font-weight="700" fill="#00FF66" letter-spacing="1">
      ⚡ TECH STACK &amp; TOOLKIT ⚡
    </text>
  </g>

  <!-- Cute Floating Git Branch Doodle (Left Margin) -->
  <g transform="translate(105, 42)" class="float-gentle">
    <line x1="6" y1="4" x2="6" y2="24" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M 6,18 Q 16,18 16,10" fill="none" stroke="#FF2A85" stroke-width="1.5"/>
    <circle cx="6" cy="6" r="3" fill="#00F0FF"/>
    <circle cx="6" cy="22" r="3" fill="#00FF66"/>
    <circle cx="16" cy="10" r="3" fill="#FF2A85"/>
    <text x="22" y="14" class="mono" font-size="9" font-weight="700" fill="#FF2A85">git:push</text>
  </g>

  <!-- Cute Floating Rocket Doodle (Right Margin) -->
  <g transform="translate(730, 36)" class="float-bob">
    <path d="M 10,0 Q 18,4 18,16 L 2,16 Q 2,4 10,0 Z" fill="#121820" stroke="#00F0FF" stroke-width="1.2" filter="url(#softGlow)"/>
    <circle cx="10" cy="8" r="2.5" fill="#00FF66"/>
    <path d="M 2,12 L -2,17 L 3,16 Z" fill="#00F0FF"/>
    <path d="M 18,12 L 22,17 L 17,16 Z" fill="#00F0FF"/>
    <path d="M 6,16 Q 10,22 10,22 Q 10,22 14,16 Z" fill="#FFD700" class="cursor-blink"/>
  </g>

  <!-- Handwritten Note Beside Title -->
  <text x="440" y="100" text-anchor="middle" class="doodle-hand" font-size="17" fill="#8b949e">
    // tools I reach for to turn coffee into production-ready software
  </text>

  <!-- Left Notebook Margin Guide Line -->
  <line x1="45" y1="0" x2="45" y2="265" stroke="#00FF66" stroke-width="1.2" opacity="0.35"/>
  <line x1="49" y1="0" x2="49" y2="265" stroke="#00F0FF" stroke-width="0.6" opacity="0.2"/>

  <!-- Row 1: Frontend & Core (Y=125) -->
  <g transform="translate(80, 125)">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect width="105" height="36" rx="18" fill="#121820" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00F0FF" class="pulse-glow"/>
      <text x="58" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">React.js</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(120, 0)">
      <rect width="105" height="36" rx="18" fill="#121820" stroke="#f0f6fc" stroke-width="1.2" opacity="0.9"/>
      <circle cx="16" cy="18" r="4" fill="#f0f6fc"/>
      <text x="58" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">Next.js</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(240, 0)">
      <rect width="115" height="36" rx="18" fill="#121820" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00F0FF"/>
      <text x="63" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">TypeScript</text>
    </g>
    <!-- Tailwind CSS -->
    <g transform="translate(370, 0)">
      <rect width="115" height="36" rx="18" fill="#121820" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00F0FF"/>
      <text x="63" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">TailwindCSS</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(500, 0)">
      <rect width="110" height="36" rx="18" fill="#121820" stroke="#FFD700" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#FFD700"/>
      <text x="61" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">JavaScript</text>
    </g>
    <!-- HTML5/CSS3 -->
    <g transform="translate(625, 0)">
      <rect width="95" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00FF66"/>
      <text x="53" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">HTML/CSS</text>
    </g>
  </g>

  <!-- Row 2: Backend, Data, AI & Cloud (Y=182, 21px gap) -->
  <g transform="translate(80, 182)">
    <!-- Node.js -->
    <g transform="translate(0, 0)">
      <rect width="105" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00FF66" class="pulse-glow"/>
      <text x="58" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">Node.js</text>
    </g>
    <!-- Python -->
    <g transform="translate(120, 0)">
      <rect width="100" height="36" rx="18" fill="#121820" stroke="#FFD700" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#FFD700"/>
      <text x="56" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">Python</text>
    </g>
    <!-- Django -->
    <g transform="translate(235, 0)">
      <rect width="100" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00FF66"/>
      <text x="56" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">Django</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(350, 0)">
      <rect width="105" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00FF66"/>
      <text x="58" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">MongoDB</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(470, 0)">
      <rect width="115" height="36" rx="18" fill="#121820" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#00F0FF"/>
      <text x="63" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">PostgreSQL</text>
    </g>
    <!-- Git & GitHub -->
    <g transform="translate(600, 0)">
      <rect width="120" height="36" rx="18" fill="#121820" stroke="#FF2A85" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#FF2A85"/>
      <text x="66" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#f0f6fc">Git &amp; GitHub</text>
    </g>
  </g>

  <!-- Continuous Flow Line to Next Section -->
  <line x1="440" y1="235" x2="440" y2="265" stroke="#00FF66" stroke-width="2" stroke-dasharray="4,4" class="connecting-line"/>
  <circle cx="440" cy="263" r="3" fill="#00FF66"/>
</svg>