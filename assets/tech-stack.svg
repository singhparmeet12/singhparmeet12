<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" width="880" height="265">
  
  <defs>
    <!-- Notebook Graph Grid Pattern -->
    <pattern id="notebookGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14231b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="12" cy="12" r="0.6" fill="#00FF66" opacity="0.25"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.65" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="color" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#00F0FF;#00FF66" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Avatar Glow -->
    <radialGradient id="avatarBackdropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    /* Lively buoyancy: 20px vertical travel (+4px to -16px) at 2.8s period */
    @keyframes floatAvatar {
      0%, 100% { transform: translateY(4px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(-1.5deg); }
    }
    @keyframes orbitCrissA {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes orbitCrissB {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitCounterA {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitCounterB {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    /* Highly visible twinkling stars around Parmeet's name */
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNeon {
      0%, 100% { opacity: 0.55; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.2; }
    }
    @keyframes radarPing {
      0% { r: 3; opacity: 1; }
      70% { r: 8; opacity: 0; }
      100% { r: 8; opacity: 0; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -32; }
    }
    .floating-avatar { animation: floatAvatar 2.8s ease-in-out infinite; transform-origin: center; }
    .orbit-a { animation: orbitCrissA 19s linear infinite; transform-origin: 0px 0px; }
    .orbit-b { animation: orbitCrissB 24s linear infinite; transform-origin: 0px 0px; }
    .counter-a { animation: orbitCounterA 19s linear infinite; transform-origin: 0px 0px; }
    .counter-b { animation: orbitCounterB 24s linear infinite; transform-origin: 0px 0px; }
    .star-twinkle-1 { animation: twinkleStar 2.2s ease-in-out infinite; transform-origin: center; }
    .star-twinkle-2 { animation: twinkleStar 2.8s ease-in-out infinite 0.7s; transform-origin: center; }
    .star-twinkle-3 { animation: twinkleStar 3.2s ease-in-out infinite 1.4s; transform-origin: center; }
    .cursor-blink { animation: blinkCursor 0.9s infinite; }
    .pulse-glow { animation: pulseNeon 2.8s ease-in-out infinite; }
    .radar-pulse { animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .connecting-line { stroke-dasharray: 6, 6; animation: dashTravel 2s linear infinite; }
  ]]></style>


  <!-- Background -->
  <rect width="880" height="265" fill="#0d1117"/>
  <rect width="880" height="265" fill="url(#notebookGrid)"/>

  <!-- Continuous Flow Line from Top -->
  <line x1="440" y1="0" x2="440" y2="28" stroke="#00FF66" stroke-width="2" stroke-dasharray="4,4" class="connecting-line"/>
  <circle cx="440" cy="28" r="4" fill="#00FF66" filter="url(#softGlow)"/>

  <!-- Section Title Badge -->
  <g transform="translate(290, 38)">
    <rect x="0" y="0" width="300" height="36" rx="18" fill="#121820" stroke="#00FF66" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="150" y="24" text-anchor="middle" class="doodle-hand" font-size="21" font-weight="700" fill="#00FF66" letter-spacing="1">
      ⚡ TECH STACK &amp; TOOLKIT ⚡
    </text>
  </g>

  <!-- Handwritten Note Beside Title -->
  <text x="440" y="100" text-anchor="middle" class="doodle-hand" font-size="17" fill="#8b949e">
    // tools I reach for to turn coffee into production-ready software
  </text>

  <!-- Left Notebook Margin Guide Line -->
  <line x1="45" y1="0" x2="45" y2="265" stroke="#00FF66" stroke-width="1.2" opacity="0.35"/>
  <line x1="49" y1="0" x2="49" y2="265" stroke="#00F0FF" stroke-width="0.6" opacity="0.2"/>

  <!-- 3 Categorized Skill Cards (Width 240 each) -->
  <!-- Card 1: Frontend -->
  <g transform="translate(70, 118)">
    <rect x="0" y="0" width="232" height="118" rx="12" fill="#121820" stroke="#00FF66" stroke-width="1.2"/>
    <rect x="12" y="10" width="100" height="20" rx="6" fill="#0d1117"/>
    <text x="18" y="24" class="mono" font-size="10.5" font-weight="700" fill="#00FF66">01 // FRONTEND</text>
    <text x="14" y="52" class="doodle-hand" font-size="16" fill="#f0f6fc">• React.js &amp; Next.js 14</text>
    <text x="14" y="74" class="doodle-hand" font-size="16" fill="#f0f6fc">• TypeScript &amp; JavaScript</text>
    <text x="14" y="96" class="doodle-hand" font-size="16" fill="#f0f6fc">• Tailwind CSS &amp; Motion</text>
  </g>

  <!-- Card 2: Backend & APIs -->
  <g transform="translate(324, 118)">
    <rect x="0" y="0" width="232" height="118" rx="12" fill="#121820" stroke="#00F0FF" stroke-width="1.2"/>
    <rect x="12" y="10" width="112" height="20" rx="6" fill="#0d1117"/>
    <text x="18" y="24" class="mono" font-size="10.5" font-weight="700" fill="#00F0FF">02 // BACKEND</text>
    <text x="14" y="52" class="doodle-hand" font-size="16" fill="#f0f6fc">• Python &amp; Django / DRF</text>
    <text x="14" y="74" class="doodle-hand" font-size="16" fill="#f0f6fc">• Node.js &amp; Express</text>
    <text x="14" y="96" class="doodle-hand" font-size="16" fill="#f0f6fc">• RESTful APIs &amp; WebSockets</text>
  </g>

  <!-- Card 3: Databases & DevOps -->
  <g transform="translate(578, 118)">
    <rect x="0" y="0" width="232" height="118" rx="12" fill="#121820" stroke="#FFD700" stroke-width="1.2"/>
    <rect x="12" y="10" width="124" height="20" rx="6" fill="#0d1117"/>
    <text x="18" y="24" class="mono" font-size="10.5" font-weight="700" fill="#FFD700">03 // DATA &amp; CLOUD</text>
    <text x="14" y="52" class="doodle-hand" font-size="16" fill="#f0f6fc">• PostgreSQL &amp; MongoDB</text>
    <text x="14" y="74" class="doodle-hand" font-size="16" fill="#f0f6fc">• Redis &amp; SQLite</text>
    <text x="14" y="96" class="doodle-hand" font-size="16" fill="#f0f6fc">• Git, Docker &amp; Vercel</text>
  </g>

  <!-- Continuous Flow Line to Projects -->
  <line x1="440" y1="236" x2="440" y2="265" stroke="#00FF66" stroke-width="2" stroke-dasharray="4,4" class="connecting-line"/>
  <circle cx="440" cy="263" r="3" fill="#00FF66"/>
</svg>