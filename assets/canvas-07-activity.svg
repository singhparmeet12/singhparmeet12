<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Uniform Canvas Background -->
    <linearGradient id="c7Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3" />
      <stop offset="100%" stop-color="#F6F8F3" />
    </linearGradient>

    <style>
      .sans-a {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-a {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Surface -->
  <rect width="900" height="180" fill="url(#c7Bg)" />

  <!-- Technical Grid Markers -->
  <line x1="60" y1="0" x2="60" y2="180" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="840" y1="0" x2="840" y2="180" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Continuous Spine Line Entrance -->
  <line x1="450" y1="0" x2="450" y2="28" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="28" r="3" fill="#4F7F5B" />

  <!-- Section Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="mono-a" font-size="12" font-weight="700" fill="#4F7F5B" letter-spacing="0.14em">
      // SYSTEM ACTIVITY &#8226; METRICS &amp; WORKFLOW
    </text>
  </g>

  <!-- 3 Elegant Stream Metrics Panels -->
  <!-- Stream 1: Code Velocity -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="240" height="85" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-a" font-size="9" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      01 // CODEBASE VELOCITY
    </text>
    <text x="16" y="50" class="sans-a" font-size="18" font-weight="800" fill="#18231A">
      Active Pipeline
    </text>
    <text x="16" y="70" class="sans-a" font-size="11" fill="#657066">
      Continuous Python &amp; Django commits
    </text>
  </g>

  <!-- Stream 2: Production Systems -->
  <g transform="translate(330, 68)">
    <rect x="0" y="0" width="240" height="85" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-a" font-size="9" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      02 // DEPLOYED SYSTEMS
    </text>
    <text x="16" y="50" class="sans-a" font-size="18" font-weight="800" fill="#18231A">
      03 Flagship Apps
    </text>
    <text x="16" y="70" class="sans-a" font-size="11" fill="#657066">
      GaadiMandi, TradeLab, TourCraze
    </text>
  </g>

  <!-- Stream 3: Focus & Quality -->
  <g transform="translate(600, 68)">
    <rect x="0" y="0" width="240" height="85" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-a" font-size="9" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      03 // ENGINEERING CRAFT
    </text>
    <text x="16" y="50" class="sans-a" font-size="18" font-weight="800" fill="#18231A">
      Clean Architecture
    </text>
    <text x="16" y="70" class="sans-a" font-size="11" fill="#657066">
      Sub-second latency &amp; modular code
    </text>
  </g>

  <!-- Continuous Spine Line Exit -->
  <line x1="450" y1="153" x2="450" y2="180" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="180" r="3" fill="#4F7F5B" />

</svg>
