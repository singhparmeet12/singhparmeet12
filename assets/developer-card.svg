<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep #050816 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="60%" stop-color="#0b1022" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Border Glow Gradient: Cyan to Purple -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Header Glass Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12182b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c1222" stop-opacity="0.95" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.85; }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .glow-border {
        animation: lineGlow 3.5s ease-in-out infinite;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      .keyword { fill: #f472b6; font-weight: 600; }
      .class-name { fill: #60a5fa; font-weight: 700; }
      .string { fill: #34d399; }
      .property { fill: #93c5fd; }
      .comment { fill: #64748b; font-style: italic; }
      .punct { fill: #94a3b8; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        fill: #94a3b8;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="8" y="8" width="764" height="314" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" class="glow-border" filter="url(#neonGlow)" />

  <!-- Main Card Body -->
  <rect x="8" y="8" width="764" height="314" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <rect x="8" y="8" width="764" height="36" rx="14" fill="url(#headerGrad)" />
  <rect x="8" y="34" width="764" height="10" fill="url(#headerGrad)" />
  <line x1="8" y1="44" x2="772" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="28" cy="26" r="5.5" fill="#ff5f56" />
  <circle cx="45" cy="26" r="5.5" fill="#ffbd2e" />
  <circle cx="62" cy="26" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="390" y="29.5" text-anchor="middle" class="title-text">⚡ parmeet@studio: ~/developer_profile.py</text>

  <!-- Session Badge -->
  <rect x="668" y="16.5" width="88" height="18" rx="9" fill="url(#badgeGrad)" />
  <text x="712" y="28.5" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">PYTHON 3.12</text>

  <!-- Code Body -->
  <g transform="translate(32, 72)" class="code-font">
    <!-- Comment -->
    <text x="0" y="0">
      <tspan class="comment"># Engineering high-performance web systems &amp; modern AI workflows</tspan>
    </text>

    <!-- Class Header -->
    <text x="0" y="28">
      <tspan class="keyword">class</tspan> <tspan class="class-name">FullStackDeveloper</tspan><tspan class="punct">:</tspan>
    </text>

    <!-- Properties -->
    <text x="24" y="54">
      <tspan class="property">name</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"Parmeet Singh"</tspan>
    </text>

    <text x="24" y="80">
      <tspan class="property">role</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"Full Stack Web Developer"</tspan>
    </text>

    <text x="24" y="106">
      <tspan class="property">stack</tspan><tspan class="punct">: </tspan><tspan class="keyword">list</tspan><tspan class="punct">[</tspan><tspan class="keyword">str</tspan><tspan class="punct">] = [</tspan><tspan class="string">"Python"</tspan><tspan class="punct">, </tspan><tspan class="string">"Django"</tspan><tspan class="punct">, </tspan><tspan class="string">"PostgreSQL"</tspan><tspan class="punct">, </tspan><tspan class="string">"JavaScript"</tspan><tspan class="punct">, </tspan><tspan class="string">"REST APIs"</tspan><tspan class="punct">] </tspan>
    </text>

    <text x="24" y="132">
      <tspan class="property">flagships</tspan><tspan class="punct">: </tspan><tspan class="keyword">list</tspan><tspan class="punct">[</tspan><tspan class="keyword">str</tspan><tspan class="punct">] = [</tspan><tspan class="string">"GaadiMandi"</tspan><tspan class="punct">, </tspan><tspan class="string">"TourCraze"</tspan><tspan class="punct">, </tspan><tspan class="string">"TradeLab"</tspan><tspan class="punct">] </tspan>
    </text>

    <text x="24" y="158">
      <tspan class="property">focus</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"High-craft web platforms, fast APIs &amp; memorable UI"</tspan>
    </text>

    <!-- Status Line with Blinking Neon Cursor -->
    <text x="24" y="186">
      <tspan class="property">status</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"🟢 Available for Full-Stack Opportunities"</tspan>
      <tspan class="cursor" fill="#38bdf8" font-weight="bold"> ▋</tspan>
    </text>
  </g>
</svg>
