<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Header Glass Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.7; }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .glow-border {
        animation: lineGlow 4s ease-in-out infinite;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
        font-size: 13.5px;
        letter-spacing: 0.3px;
      }
      .keyword { fill: #f472b6; font-weight: 600; }
      .class-name { fill: #60a5fa; font-weight: 700; }
      .func { fill: #a78bfa; }
      .string { fill: #34d399; }
      .property { fill: #93c5fd; }
      .comment { fill: #64748b; font-style: italic; }
      .punct { fill: #94a3b8; }
      .number { fill: #fbbf24; }
      .highlight { fill: #38bdf8; font-weight: 600; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #94a3b8;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="10" y="10" width="800" height="390" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="glow-border" filter="url(#glow)" />

  <!-- Main Card Body -->
  <rect x="10" y="10" width="800" height="390" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="10" y="10" width="800" height="42" rx="16" fill="url(#headerGrad)" />
  <rect x="10" y="42" width="800" height="10" fill="url(#headerGrad)" />
  <line x1="10" y1="52" x2="810" y2="52" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="32" cy="31" r="6.5" fill="#ff5f56" />
  <circle cx="52" cy="31" r="6.5" fill="#ffbd2e" />
  <circle cx="72" cy="31" r="6.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="410" y="35" text-anchor="middle" class="title-text">⚡ active_session.py — Parmeet Singh's Coding Studio</text>

  <!-- Session Badge -->
  <rect x="700" y="21" width="90" height="20" rx="10" fill="url(#badgeGrad)" />
  <text x="745" y="34.5" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">DJANGO 5.X</text>

  <!-- Code Body Container -->
  <g transform="translate(36, 82)" class="code-font">
    <!-- Line 1: Comment -->
    <text x="0" y="0">
      <tspan class="comment"># Engineering high-performance web platforms &amp; AI architectures</tspan>
    </text>

    <!-- Line 3: Class Header -->
    <text x="0" y="32">
      <tspan class="keyword">class</tspan>
      <tspan class="punct"> </tspan>
      <tspan class="class-name">FullStackDeveloper</tspan><tspan class="punct">:</tspan>
    </text>

    <!-- Line 4: Developer Identity -->
    <text x="24" y="60">
      <tspan class="property">name</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"Parmeet Singh"</tspan>
    </text>

    <!-- Line 5: Primary Focus -->
    <text x="24" y="88">
      <tspan class="property">role</tspan><tspan class="punct">: </tspan><tspan class="keyword">str</tspan><tspan class="punct"> = </tspan><tspan class="string">"Full-Stack Python &amp; Django Engineer | AI Builder"</tspan>
    </text>

    <!-- Line 6: Core Stack Array -->
    <text x="24" y="116">
      <tspan class="property">core_stack</tspan><tspan class="punct">: </tspan><tspan class="keyword">list</tspan><tspan class="punct">[</tspan><tspan class="keyword">str</tspan><tspan class="punct">] = [</tspan>
    </text>
    <text x="48" y="142">
      <tspan class="string">"Python"</tspan><tspan class="punct">, </tspan>
      <tspan class="string">"Django 5.x"</tspan><tspan class="punct">, </tspan>
      <tspan class="string">"PostgreSQL"</tspan><tspan class="punct">, </tspan>
      <tspan class="string">"JavaScript (ES6+)"</tspan><tspan class="punct">, </tspan>
      <tspan class="string">"YOLOv5 / CV"</tspan>
    </text>
    <text x="24" y="168">
      <tspan class="punct">]</tspan>
    </text>

    <!-- Line 7: Active Deployments -->
    <text x="24" y="196">
      <tspan class="property">flagship_projects</tspan><tspan class="punct">: </tspan><tspan class="keyword">dict</tspan> <tspan class="punct">= {</tspan>
    </text>
    <text x="48" y="222">
      <tspan class="string">"GaadiMandi"</tspan><tspan class="punct">: </tspan><tspan class="string">"Automotive Dealer &amp; Inventory Platform"</tspan><tspan class="punct">, </tspan>
    </text>
    <text x="48" y="248">
      <tspan class="string">"TourCraze"</tspan><tspan class="punct">: </tspan><tspan class="string">"Smart Travel Planner + TripSplit Greedy Algo"</tspan><tspan class="punct">, </tspan>
    </text>
    <text x="48" y="274">
      <tspan class="string">"TradeLab"</tspan><tspan class="punct">: </tspan><tspan class="string">"AI Trading Platform + YOLOv5 Pattern Vision"</tspan>
    </text>
    <text x="24" y="300">
      <tspan class="punct">}</tspan>
    </text>

    <!-- Line 8: Status with Blinking Cursor -->
    <text x="24" y="328">
      <tspan class="property">status</tspan><tspan class="punct">: </tspan><tspan class="string">"🟢 Open to Full-Stack Opportunities &amp; High-Impact Roles"</tspan>
      <tspan class="cursor" fill="#38bdf8" font-weight="bold"> ▋</tspan>
    </text>
  </g>
</svg>
