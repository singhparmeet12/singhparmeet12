<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 125" width="880" height="125">
  
  <defs>
    <!-- Notebook Graph Grid Pattern -->
    <pattern id="notebookGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14231b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="12" cy="12" r="0.6" fill="#00FF66" opacity="0.25"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="color" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#00F0FF;#00FF66" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Avatar Glow -->
    <radialGradient id="avatarBackdropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1deg); }
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-2deg); }
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes floatWobble {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes steamRise {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.15); }
      60% { transform: scale(0.95); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNeon {
      0%, 100% { opacity: 0.55; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.2; }
    }
    @keyframes radarPing {
      0% { r: 3; opacity: 1; }
      70% { r: 8; opacity: 0; }
      100% { r: 8; opacity: 0; }
    }
    @keyframes starTwinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -32; }
    }
    .floating-avatar { animation: floatAvatar 4.5s ease-in-out infinite; transform-origin: center; }
    .float-gentle { animation: floatGentle 4s ease-in-out infinite; transform-origin: center; }
    .float-bob { animation: floatBob 3.6s ease-in-out infinite; transform-origin: center; }
    .float-wobble { animation: floatWobble 4.2s ease-in-out infinite; transform-origin: center; }
    .steam-1 { animation: steamRise 2.2s linear infinite; }
    .steam-2 { animation: steamRise 2.2s linear infinite 0.7s; }
    .steam-3 { animation: steamRise 2.2s linear infinite 1.4s; }
    .heart-pulse { animation: heartBeat 1.8s ease-in-out infinite; transform-origin: center; }
    .cursor-blink { animation: blinkCursor 0.9s infinite; }
    .pulse-glow { animation: pulseNeon 2.8s ease-in-out infinite; }
    .radar-pulse { animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .star-1 { animation: starTwinkle 2.5s ease-in-out infinite; transform-origin: center; }
    .star-2 { animation: starTwinkle 2.5s ease-in-out infinite 1.2s; transform-origin: center; }
    .connecting-line { stroke-dasharray: 6, 6; animation: dashTravel 2s linear infinite; }
  ]]></style>


  <!-- Background -->
  <rect width="880" height="125" fill="#0d1117"/>
  <rect width="880" height="125" fill="url(#notebookGrid)"/>

  <!-- Left Continuous Margin Guide Line -->
  <line x1="45" y1="0" x2="45" y2="125" stroke="#00FF66" stroke-width="1.2" opacity="0.35"/>
  <line x1="49" y1="0" x2="49" y2="125" stroke="#00F0FF" stroke-width="0.6" opacity="0.2"/>

  <!-- Continuous Flow Line entering from projects -->
  <line x1="440" y1="0" x2="440" y2="22" stroke="#00FF66" stroke-width="2" stroke-dasharray="4,4" class="connecting-line"/>

  <!-- Header Badge -->
  <g transform="translate(285, 22)">
    <rect x="0" y="0" width="310" height="40" rx="20" fill="#121820" stroke="#00FF66" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="155" y="26" text-anchor="middle" class="doodle-hand" font-size="22" font-weight="700" fill="#00FF66" letter-spacing="1">
      💬 LET'S CONNECT &amp; BUILD 💬
    </text>
  </g>

  <!-- Cute Floating Chat Bubble Doodle (Left) -->
  <g transform="translate(195, 22)" class="float-gentle">
    <path d="M 0,0 L 28,0 Q 34,0 34,6 L 34,18 Q 34,24 28,24 L 10,24 L 2,30 L 4,24 L 0,24 Q -6,24 -6,18 L -6,6 Q -6,0 0,0 Z" fill="#121820" stroke="#00F0FF" stroke-width="1.2" filter="url(#softGlow)"/>
    <text x="14" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00F0FF">:)</text>
  </g>

  <!-- Cute Floating Coffee Cup Doodle (Right) -->
  <g transform="translate(640, 22)" class="float-bob">
    <path d="M 0,4 L 2,18 Q 3,22 7,22 L 17,22 Q 21,22 22,18 L 24,4 Z" fill="#121820" stroke="#FFD700" stroke-width="1.2" filter="url(#softGlow)"/>
    <path d="M 23,7 Q 29,7 29,12 Q 29,17 22,17" fill="none" stroke="#FFD700" stroke-width="1.2"/>
    <path d="M 6,1 Q 5,-4 7,-8" fill="none" stroke="#00FF66" stroke-width="1" stroke-linecap="round" class="steam-1"/>
    <path d="M 12,2 Q 14,-3 11,-7" fill="none" stroke="#00F0FF" stroke-width="1" stroke-linecap="round" class="steam-2"/>
    <path d="M 18,1 Q 16,-4 19,-8" fill="none" stroke="#00FF66" stroke-width="1" stroke-linecap="round" class="steam-3"/>
  </g>

  <!-- Friendly Handwritten Note (Generous spacing) -->
  <text x="440" y="96" text-anchor="middle" class="doodle-hand" font-size="19" fill="#8b949e">
    Always excited for new projects, full-time opportunities, or tech discussions!
  </text>
</svg>