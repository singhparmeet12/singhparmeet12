<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8" />
      <stop offset="100%" stop-color="#EEF6F1" />
    </linearGradient>

    <style>
      .mono-d { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans-d { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base Frame -->
  <rect x="2" y="2" width="876" height="116" rx="12" fill="url(#dashBg)" stroke="#D4E7D9" stroke-width="1.2" />

  <!-- Metric 1: COMMITS & CORE -->
  <g transform="translate(32, 22)">
    <text x="0" y="10" class="mono-d" font-size="9.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      01 // COMMITS &amp; CODE
    </text>
    <text x="0" y="38" class="sans-d" font-size="20" font-weight="800" fill="#17231A">
      Python &amp; Django
    </text>
    <text x="0" y="58" class="sans-d" font-size="11.5" fill="#607064">
      Backend systems &amp; REST APIs
    </text>
  </g>

  <line x1="225" y1="20" x2="225" y2="100" stroke="#D7EBDE" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 2: PROJECTS -->
  <g transform="translate(245, 22)">
    <text x="0" y="10" class="mono-d" font-size="9.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      02 // PROJECTS
    </text>
    <text x="0" y="38" class="sans-d" font-size="20" font-weight="800" fill="#17231A">
      03 Flagships
    </text>
    <text x="0" y="58" class="sans-d" font-size="11.5" fill="#607064">
      Live automotive &amp; quant web apps
    </text>
  </g>

  <line x1="450" y1="20" x2="450" y2="100" stroke="#D7EBDE" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 3: CONTRIBUTIONS -->
  <g transform="translate(470, 22)">
    <text x="0" y="10" class="mono-d" font-size="9.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      03 // CONTRIBUTIONS
    </text>
    <text x="0" y="38" class="sans-d" font-size="20" font-weight="800" fill="#17231A">
      Digital Garden
    </text>
    <text x="0" y="58" class="sans-d" font-size="11.5" fill="#607064">
      Web platforms &amp; CV pipelines
    </text>
  </g>

  <line x1="665" y1="20" x2="665" y2="100" stroke="#D7EBDE" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 4: STREAK / STATUS -->
  <g transform="translate(685, 22)">
    <text x="0" y="10" class="mono-d" font-size="9.5" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
      04 // STREAK &amp; PULSE
    </text>
    <text x="0" y="38" class="sans-d" font-size="20" font-weight="800" fill="#146B32">
      Daily Active
    </text>
    <text x="0" y="58" class="sans-d" font-size="11.5" fill="#607064">
      Building &amp; pushing code
    </text>
  </g>

</svg>
