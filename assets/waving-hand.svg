<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .hand-wave {
        transform-origin: 50px 85px;
        animation: wave 2.4s ease-in-out infinite;
      }
      .sparkle {
        animation: twinkle 2.4s ease-in-out infinite;
      }
      @keyframes wave {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(14deg); }
        30% { transform: rotate(-8deg); }
        45% { transform: rotate(14deg); }
        60% { transform: rotate(-4deg); }
        75% { transform: rotate(10deg); }
        88% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.4); }
        30%, 60% { opacity: 1; transform: scale(1); }
        85% { opacity: 0; transform: scale(0.4); }
      }
    </style>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDEBD9"/>
      <stop offset="100%" stop-color="#F5CBA7"/>
    </linearGradient>
    <linearGradient id="cuffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F7F5B"/>
      <stop offset="100%" stop-color="#3A6344"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A6344" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient glow circle -->
  <circle cx="50" cy="50" r="42" fill="#F6F8F3" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Waving Hand Group -->
  <g class="hand-wave" filter="url(#softGlow)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 50 85; 14 50 85; -8 50 85; 14 50 85; -4 50 85; 10 50 85; 0 50 85; 0 50 85" 
      keyTimes="0; 0.15; 0.3; 0.45; 0.6; 0.75; 0.88; 1" 
      dur="2.4s" 
      repeatCount="indefinite" />

    <!-- Sleeve / Cuff -->
    <path d="M 37,82 L 63,82 L 61,96 L 39,96 Z" fill="url(#cuffGrad)" rx="2"/>
    <line x1="37" y1="82" x2="63" y2="82" stroke="#24452E" stroke-width="2"/>

    <!-- Thumb -->
    <path d="M 60,65 C 68,62 74,54 71,48 C 68,42 61,46 56,53" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Palm -->
    <path d="M 38,76 C 36,65 37,55 41,50 C 43,47 57,47 59,50 C 63,55 64,65 62,76 Z" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2"/>

    <!-- Index Finger -->
    <path d="M 54,51 C 55,42 57,28 54,24 C 51,20 47,21 47,26 L 48,51" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Middle Finger -->
    <path d="M 48,51 C 48,40 48,24 45,21 C 42,18 38,19 39,25 L 42,52" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Ring Finger -->
    <path d="M 42,53 C 41,43 40,28 37,25 C 34,22 30,23 31,29 L 35,55" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pinky Finger -->
    <path d="M 35,56 C 33,48 31,36 28,33 C 25,30 22,31 23,37 L 29,62" fill="url(#palmGrad)" stroke="#E0B28C" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Friendly Sparkle Star -->
  <g class="sparkle" transform-origin="78 28">
    <path d="M 78,22 Q 78,28 84,28 Q 78,28 78,34 Q 78,28 72,28 Q 78,28 78,22 Z" fill="#4F7F5B"/>
    <circle cx="78" cy="28" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
