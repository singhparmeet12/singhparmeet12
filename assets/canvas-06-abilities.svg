<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Uniform Canvas Background -->
    <linearGradient id="c6Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3" />
      <stop offset="100%" stop-color="#F6F8F3" />
    </linearGradient>

    <style>
      .sans-tech {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-tech {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Canvas Surface -->
  <rect width="900" height="280" fill="url(#c6Bg)" />

  <!-- Technical Grid Markers -->
  <line x1="60" y1="0" x2="60" y2="280" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="840" y1="0" x2="840" y2="280" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Continuous Spine Line Entrance -->
  <line x1="450" y1="0" x2="450" y2="30" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="30" r="3" fill="#4F7F5B" />

  <!-- Section Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="mono-tech" font-size="12" font-weight="700" fill="#4F7F5B" letter-spacing="0.14em">
      // BUILDING WITH &#8226; TECHNICAL DISCIPLINES
    </text>
  </g>

  <!-- 4 Integrated Technical Constellation Blocks -->
  <!-- Block 1: Backend Architecture -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-tech" font-size="9.5" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      BACKEND &amp; ARCHITECTURE
    </text>
    <text x="16" y="48" class="sans-tech" font-size="13" font-weight="600" fill="#18231A">
      Python &#8226; Django 5.x &#8226; PostgreSQL
    </text>
    <text x="16" y="66" class="sans-tech" font-size="11.5" fill="#657066">
      Relational Database Design, SQLite &amp; RESTful APIs
    </text>
  </g>

  <!-- Block 2: Applied Intelligence -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-tech" font-size="9.5" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      DATA &amp; APPLIED INTELLIGENCE
    </text>
    <text x="16" y="48" class="sans-tech" font-size="13" font-weight="600" fill="#18231A">
      YOLOv5 &#8226; Computer Vision &#8226; OpenCV
    </text>
    <text x="16" y="66" class="sans-tech" font-size="11.5" fill="#657066">
      Machine Learning Pipelines, Data Analytics &amp; Pandas
    </text>
  </g>

  <!-- Block 3: Frontend Craft -->
  <g transform="translate(60, 165)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-tech" font-size="9.5" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      FRONTEND &amp; UI SYSTEMS
    </text>
    <text x="16" y="48" class="sans-tech" font-size="13" font-weight="600" fill="#18231A">
      JavaScript (ES6+) &#8226; Modern CSS Systems
    </text>
    <text x="16" y="66" class="sans-tech" font-size="11.5" fill="#657066">
      HTML5 Canvas VFX, Bootstrap 5 &amp; Fluid Interfaces
    </text>
  </g>

  <!-- Block 4: Platforms & Delivery -->
  <g transform="translate(470, 165)">
    <rect x="0" y="0" width="370" height="80" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="16" y="24" class="mono-tech" font-size="9.5" font-weight="700" fill="#24452E" letter-spacing="0.08em">
      PLATFORMS &amp; WORKFLOWS
    </text>
    <text x="16" y="48" class="sans-tech" font-size="13" font-weight="600" fill="#18231A">
      Git &#8226; GitHub &#8226; Vercel Serverless
    </text>
    <text x="16" y="66" class="sans-tech" font-size="11.5" fill="#657066">
      Cloudinary Media Pipeline, Pine Script &amp; Postman
    </text>
  </g>

  <!-- Continuous Spine Line Weaving Through Center and Exiting -->
  <line x1="450" y1="70" x2="450" y2="280" stroke="#4F7F5B" stroke-width="1.2" stroke-dasharray="4 4" />
  <circle cx="450" cy="280" r="3" fill="#4F7F5B" />

</svg>
