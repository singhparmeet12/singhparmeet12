<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230">
  <defs>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #18231A;
        letter-spacing: -0.025em;
      }
      .tagline {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #4F7F5B;
        letter-spacing: 0.16em;
      }
      .bio {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 400;
        fill: #657066;
        line-height: 1.5;
      }
      .pill-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #24452E;
        letter-spacing: 0.08em;
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3"/>
      <stop offset="100%" stop-color="#FAFBF7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F7F5B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4F7F5B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F7F5B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="0" y="0" width="880" height="230" rx="20" fill="url(#bgGrad)" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Subtle corner aesthetic details -->
  <circle cx="28" cy="28" r="3" fill="#DCE8D8"/>
  <circle cx="852" cy="28" r="3" fill="#DCE8D8"/>
  <circle cx="28" cy="202" r="3" fill="#DCE8D8"/>
  <circle cx="852" cy="202" r="3" fill="#DCE8D8"/>

  <!-- Status Pill -->
  <g transform="translate(440, 42)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#EAF2E8" stroke="#D0E2CC" stroke-width="1"/>
    <circle cx="-116" cy="0" r="4" fill="#4F7F5B"/>
    <text x="-104" y="4" class="pill-text">FULL-STACK DEVELOPER &#8226; DELHI, IN</text>
  </g>

  <!-- Main Headline -->
  <text x="440" y="112" class="title" text-anchor="middle">Hey there, I&#8217;m Parmeet.</text>

  <!-- Specialization Track -->
  <text x="440" y="146" class="tagline" text-anchor="middle">WEB &#8226; DATA &#8226; AI &#8226; CREATIVE TECH</text>

  <!-- Personal Statement -->
  <text x="440" y="182" class="bio" text-anchor="middle">Currently building things, breaking things, and learning along the way.</text>

  <!-- Bottom Accent Divider Line -->
  <line x1="180" y1="210" x2="700" y2="210" stroke="url(#lineGrad)" stroke-width="1.5"/>
</svg>
