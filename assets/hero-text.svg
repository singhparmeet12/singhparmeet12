<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="500" height="480">
  <defs>
    <style>
      .status-pill {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #24452E;
        letter-spacing: 0.1em;
      }
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.03em;
      }
      .role-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        font-weight: 700;
        fill: #4F7F5B;
        letter-spacing: 0.14em;
      }
      .hero-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 15.5px;
        font-weight: 400;
        fill: #657066;
        line-height: 1.5;
      }
      .term-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 500;
        fill: #24452E;
      }
      .term-cmd {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #4F7F5B;
      }
      .btn-resume {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.04em;
      }
      .btn-contact {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #24452E;
        letter-spacing: 0.04em;
      }
    </style>
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFCF8"/>
      <stop offset="100%" stop-color="#F4F7F1"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF2E8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="500" height="480" rx="20" fill="url(#heroCardBg)" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Live Status Pill -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#EAF2E8" stroke="#D0E2CC" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#4F7F5B">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" class="status-pill">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Greeting Headline -->
  <text x="32" y="112" class="hero-title">Hey, I&#8217;m Parmeet.</text>

  <!-- Role Subtitle Tag -->
  <text x="32" y="142" class="role-tag">FULL-STACK DEVELOPER &#8226; WEB &#8226; DATA &#8226; AI</text>

  <!-- Short Natural Philosophy -->
  <text x="32" y="174" class="hero-sub">Building things, breaking things, and crafting modern,</text>
  <text x="32" y="196" class="hero-sub">intelligent web experiences from Delhi, India.</text>

  <!-- Minimal Interactive Terminal Widget -->
  <g transform="translate(32, 226)">
    <rect x="0" y="0" width="436" height="152" rx="12" fill="url(#termBg)" stroke="#DCE8D8" stroke-width="1.2"/>
    
    <!-- Terminal Header Dots -->
    <circle cx="16" cy="16" r="4" fill="#E8B0A8"/>
    <circle cx="28" cy="16" r="4" fill="#E8D4A8"/>
    <circle cx="40" cy="16" r="4" fill="#B0D8B4"/>
    <text x="320" y="19" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9DB89B">bash - parmeet.sh</text>
    <line x1="0" y1="30" x2="436" y2="30" stroke="#DCE8D8" stroke-width="1"/>

    <!-- Terminal Lines -->
    <text x="16" y="52" class="term-cmd">$ whoami</text>
    <text x="16" y="70" class="term-text">> Parmeet Singh (Full-Stack Engineer &amp; Creative Technologist)</text>

    <text x="16" y="96" class="term-cmd">$ cat current_focus.txt</text>
    <text x="16" y="114" class="term-text">> Python, Django 5, JavaScript, AI Computer Vision, Web Craft</text>

    <!-- Pulsing cursor -->
    <rect x="16" y="128" width="8" height="13" fill="#4F7F5B">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Action CTA Buttons -->
  <g transform="translate(32, 404)">
    <!-- View Resume Button -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#24452E"/>
      <text x="90" y="24" class="btn-resume" text-anchor="middle">VIEW RESUME &#8594;</text>
    </g>

    <!-- Connect Button -->
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="150" height="38" rx="10" fill="#EAF2E8" stroke="#D0E2CC" stroke-width="1"/>
      <text x="75" y="24" class="btn-contact" text-anchor="middle">LET&#8217;S TALK &#8599;</text>
    </g>
  </g>
</svg>
