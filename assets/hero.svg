    </text>

    <!-- Tri-Pillar Architecture Label -->
    <text x="0" y="126" class="mono-text" font-size="11.5" font-weight="600" fill="#607064" letter-spacing="0.12em">
      DATA &#8226; AI &#8226; WEB
    </text>

    <!-- Short Intelligent Statement -->
    <text x="0" y="168" class="sans-text" font-size="13" font-weight="400" fill="#4B5E50" line-height="1.5">
      Building scalable digital products, data-driven systems,
    </text>
    <text x="0" y="188" class="sans-text" font-size="13" font-weight="400" fill="#4B5E50">
      and performant web architectures with high technical craft.
    </text>

    <!-- Technical Coordinate Detail -->
    <g transform="translate(0, 226)" class="mono-text" font-size="10" fill="#7A8D7E">
      <text x="0" y="0">ECOSYSTEM // DIGITAL GARDEN</text>
      <text x="210" y="0">NODE: 28.6°N 77.2°E</text>
    </g>

  </g>

  <!-- Subtle Vertical Divider -->
