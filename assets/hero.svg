<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8" />
      <stop offset="50%" stop-color="#EFF7F1" />
      <stop offset="100%" stop-color="#E8F4EC" />
    </linearGradient>

    <!-- Card Inner Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DA44E" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#9BE9A8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#146B32" stop-opacity="0.4" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDF5E4" />
      <stop offset="100%" stop-color="#CEEED6" />
    </linearGradient>

    <style>
      @keyframes cellPulse {
        0%, 100% { fill: #E2F2E6; opacity: 0.6; }
        50% { fill: #2DA44E; opacity: 0.95; }
      }
      @keyframes cellGlow {
        0%, 100% { fill: #C4E8CD; }
        35% { fill: #40C463; }
        70% { fill: #146B32; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      .mono-text {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }

      .pulse-dot {
        animation: blinkDot 2.2s infinite ease-in-out;
        transform-origin: 52px 42px;
      }

      /* Staggered animated cells */
      .c-anim-1 { animation: cellPulse 4.2s infinite ease-in-out; animation-delay: 0.2s; }
      .c-anim-2 { animation: cellPulse 3.8s infinite ease-in-out; animation-delay: 0.8s; }
      .c-anim-3 { animation: cellGlow 4.6s infinite ease-in-out; animation-delay: 1.4s; }
      .c-anim-4 { animation: cellPulse 4.0s infinite ease-in-out; animation-delay: 2.1s; }
      .c-anim-5 { animation: cellGlow 5.0s infinite ease-in-out; animation-delay: 2.7s; }
      .c-anim-6 { animation: cellPulse 3.6s infinite ease-in-out; animation-delay: 3.3s; }

      .flow-line {
        stroke-dasharray: 6 6;
        animation: streamFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Container with Subtle Green Accent -->
  <rect x="2" y="2" width="876" height="316" rx="16" fill="url(#heroBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid Lines in the Background -->
  <g stroke="#2DA44E" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="520" y1="0" x2="520" y2="320" />
    <line x1="0" y1="70" x2="880" y2="70" />
    <line x1="0" y1="160" x2="880" y2="160" />
    <line x1="0" y1="250" x2="880" y2="250" />
  </g>

  <!-- ======================================================================
       LEFT PANE: IDENTITY & TYPOGRAPHY
       ====================================================================== -->
  <g transform="translate(42, 42)">
    
    <!-- Top System Pill Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="url(#badgeGrad)" stroke="#BEE7C8" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#2DA44E" class="pulse-dot" />
    <text x="24" y="16" class="mono-text" font-size="10.5" font-weight="700" fill="#146B32" letter-spacing="0.06em">
      SYSTEM STATUS: ACTIVE
    </text>

    <!-- Main Name -->
    <text x="0" y="72" class="sans-text" font-size="38" font-weight="800" fill="#17231A" letter-spacing="-0.03em">
      PARMEET SINGH
    </text>

    <!-- Role Subheading -->
    <text x="0" y="104" class="mono-text" font-size="13" font-weight="700" fill="#2DA44E" letter-spacing="0.08em">
