<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 170" width="430" height="170">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#1a3a1a" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.15"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes borderGlow { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }
    .glow-border { animation: borderGlow 3s ease-in-out infinite; }
  </style>

  <!-- Card background -->
  <rect width="430" height="170" rx="12" fill="#0d1117"/>
  <rect width="430" height="170" rx="12" fill="url(#dots)" opacity="0.5"/>
  <rect x="1" y="1" width="428" height="168" rx="11" fill="none" stroke="#161b22" stroke-width="1"/>

  <!-- Neon left accent bar -->
  <rect x="0" y="20" width="3.5" height="130" rx="2" fill="#39FF14" class="glow-border" filter="url(#glow)"/>

  <!-- Project number (large, dim) -->
  <text x="390" y="45" text-anchor="end" font-family="'Consolas', 'SF Mono', 'Fira Code', monospace" font-size="40" font-weight="800" fill="#1a3a1a" opacity="0.5">04</text>

  <!-- Project name -->
  <text x="24" y="48" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Portfolio</text>

  <!-- Tech tags -->
  <text x="24" y="72" font-family="'Consolas', 'SF Mono', 'Fira Code', monospace" font-size="11" fill="#39FF14" opacity="0.7">Next.js · Tailwind · Motion</text>

  <!-- Description -->
  <text x="24" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" opacity="0.75">Personal developer portfolio</text>
  <text x="24" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" opacity="0.75">with interactive project showcases.</text>

  <!-- LIVE DEMO link -->
  <text x="24" y="152" font-family="'Consolas', 'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#39FF14" filter="url(#softGlow)">LIVE DEMO  →</text>
</svg>