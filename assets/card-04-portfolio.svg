<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 210" width="430" height="210">
  <defs>
    <filter id="cardGlow_04" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00FF66" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

.doodle-hand {
  font-family: 'Patrick Hand', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}
.sans {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

    @keyframes radarPing_04 {
      0% { r: 3; opacity: 1; }
      70% { r: 7; opacity: 0; }
      100% { r: 7; opacity: 0; }
    }
    .radar-pulse { animation: radarPing_04 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    @keyframes borderPulse_04 {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .glow-border { animation: borderPulse_04 3s ease-in-out infinite; }
    .float-gentle { animation: floatGentle 4s ease-in-out infinite; transform-origin: center; }
    .float-bob { animation: floatBob 3.6s ease-in-out infinite; transform-origin: center; }
    .star-1 { animation: starTwinkle 2.5s ease-in-out infinite; transform-origin: center; }
  ]]></style>

  <!-- Card Surface (Doodle Notebook Card) -->
  <rect x="3" y="3" width="424" height="204" rx="16" fill="#121820"/>

  <!-- Sketched Doodle Neon Border -->
  <rect x="3" y="3" width="424" height="204" rx="16" fill="none" stroke="#00FF66" stroke-width="1.5" class="glow-border" filter="url(#cardGlow_04)"/>

  <!-- Left Accent Notch -->
  <rect x="3" y="30" width="4" height="150" rx="2" fill="#00FF66"/>

  <!-- Top Notebook Tape Header Accent -->
  <polygon points="25,3 110,3 105,14 20,14" fill="#00FF66" opacity="0.25"/>

  <!-- Status Beacon Badge -->
  <g transform="translate(290, 18)">
    <rect x="0" y="0" width="122" height="22" rx="11" fill="#0d1117" stroke="#00FF66" stroke-width="1"/>
    <!-- Animated Radar Circle -->
    <circle cx="14" cy="11" r="3.5" fill="#00FF66"/>
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#00FF66" stroke-width="1.5" class="radar-pulse"/>
    <text x="24" y="15" class="mono" font-size="9" font-weight="700" fill="#00FF66" letter-spacing="0.5">● LIVE SITE</text>
  </g>

  <!-- Project Number & Category -->
  <text x="22" y="44" class="mono" font-size="12.5" font-weight="700" fill="#00FF66" letter-spacing="1">04 // DEVELOPER SHOWCASE</text>

  <!-- Project Title -->
  <text x="22" y="76" class="doodle-hand" font-size="29" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">Personal Portfolio</text>

  <!-- Cute Floating Neon Doodle Icon on Card -->
  
          <g transform="translate(380, 78)" class="star-1">
            <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#00FF66" filter="url(#softGlow)"/>
          </g>
        

  <!-- Short, Crisp, Clear Description (Single line, ample whitespace) -->
  <text x="22" y="108" class="doodle-hand" font-size="17" fill="#8b949e">Interactive 3D developer showcase with sleek motion animations.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 142)">
    <text x="0" y="12" class="mono" font-size="11.5" font-weight="600" fill="#00F0FF" opacity="0.88">Next.js • TailwindCSS • Framer Motion</text>
  </g>

  <!-- Launch Prompt Bar (Click Card To Launch) -->
  <g transform="translate(22, 168)">
    <rect x="0" y="0" width="386" height="26" rx="8" fill="#0d1117" stroke="#00FF66" stroke-width="1" opacity="0.9"/>
    <text x="193" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#00FF66" letter-spacing="1">
      CLICK CARD TO LAUNCH LIVE APP ↗
    </text>
  </g>
</svg>