<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 146" width="420" height="146">
  <defs>
    <style>
      .proj-num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #4F7F5B;
      }
      .proj-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.01em;
      }
      .proj-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #657066;
        line-height: 1.4;
      }
      .proj-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #24452E;
      }
      .btn-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.04em;
      }
    </style>
    <linearGradient id="cellBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAF6"/>
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect x="1" y="1" width="418" height="144" rx="14" fill="url(#cellBg3)" stroke="#DCE8D8" stroke-width="1.2"/>

  <!-- Header row -->
  <text x="18" y="28" class="proj-num">03</text>
  <text x="44" y="28" class="proj-title">GAADIMANDI</text>

  <!-- Mini Gauge visual -->
  <g transform="translate(350, 14)">
    <path d="M 6,28 A 15,15 0 0,1 36,28" fill="none" stroke="#DCE8D8" stroke-width="2.5"/>
    <path d="M 6,28 A 15,15 0 0,1 28,16" fill="none" stroke="#4F7F5B" stroke-width="2.5"/>
    <circle cx="21" cy="28" r="2.5" fill="#24452E"/>
    <line x1="21" y1="28" x2="27" y2="18" stroke="#24452E" stroke-width="1.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 21 28; 18 21 28; -12 21 28; 0 21 28" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- One line description -->
  <text x="18" y="52" class="proj-desc">Automotive dealership marketplace with distributed vehicle</text>
  <text x="18" y="70" class="proj-desc">inventory management and instant inquiries.</text>

  <!-- Stack Tag Pill -->
  <rect x="18" y="98" width="220" height="26" rx="13" fill="#EAF2E8" stroke="#D0E2CC" stroke-width="0.8"/>
  <text x="28" y="115" class="proj-tag">Django 5.x &#8226; PostgreSQL &#8226; REST</text>

  <!-- Active Launch Button -->
  <g transform="translate(290, 96)">
    <rect x="0" y="0" width="112" height="30" rx="8" fill="#24452E"/>
    <text x="56" y="19" class="btn-txt" text-anchor="middle">LAUNCH DEMO &#8599;</text>
  </g>
</svg>
