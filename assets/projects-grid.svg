<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375">
  <defs>
    <style>
      .label-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #4F7F5B;
        letter-spacing: 0.16em;
      }
      .sec-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.02em;
      }
      .proj-num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #4F7F5B;
      }
      .proj-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 800;
        fill: #18231A;
        letter-spacing: -0.01em;
      }
      .proj-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #657066;
        line-height: 1.4;
      }
      .proj-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #24452E;
      }
      .btn-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .candle-pulse {
        animation: pulseCandle 2.2s ease-in-out infinite alternate;
      }
      .route-pulse {
        animation: dashMove 3s linear infinite;
      }
      @keyframes pulseCandle {
        0% { transform: scaleY(0.85); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -20; }
      }
    </style>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFCF8"/>
      <stop offset="100%" stop-color="#F4F7F1"/>
    </linearGradient>
    <linearGradient id="cellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAF6"/>
    </linearGradient>
  </defs>

  <!-- Continuous Flow Line In -->
  <line x1="440" y1="0" x2="440" y2="14" stroke="#4F7F5B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Master Container Frame -->
  <rect x="0" y="14" width="880" height="348" rx="18" fill="url(#gridBg)" stroke="#DCE8D8" stroke-width="1.5"/>

  <!-- Header & Status Beacon -->
  <g transform="translate(32, 38)">
    <circle cx="6" cy="4" r="4" fill="#4F7F5B">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="4" r="8" fill="none" stroke="#4F7F5B" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="8" class="label-mono">SELECTED WORK &#8226; COMPACT BENTO GRID</text>
    <text x="680" y="8" class="label-mono" fill="#657066">4 LIVE PLATFORMS</text>
  </g>

  <!-- =================================================================== -->
  <!-- CELL 01: TRADELAB (Top-Left)                                        -->
  <!-- =================================================================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="404" height="138" rx="12" fill="url(#cellBg)" stroke="#DCE8D8" stroke-width="1.2"/>
    
    <!-- Header row -->
    <text x="18" y="26" class="proj-num">01</text>
    <text x="44" y="26" class="proj-title">TRADELAB</text>
    
    <!-- Mini Candlestick visual -->
    <g transform="translate(330, 14)">
      <line x1="10" y1="4" x2="10" y2="28" stroke="#9DB89B" stroke-width="1"/>
      <rect x="7" y="10" width="6" height="12" fill="#DCE8D8" rx="1"/>
      <line x1="22" y1="2" x2="22" y2="30" stroke="#4F7F5B" stroke-width="1"/>
      <rect x="19" y="8" width="6" height="16" fill="#4F7F5B" rx="1">
        <animate attributeName="height" values="14;18;14" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <line x1="34" y1="0" x2="34" y2="26" stroke="#4F7F5B" stroke-width="1"/>
      <rect x="31" y="5" width="6" height="12" fill="#4F7F5B" rx="1"/>
    </g>

    <text x="18" y="48" class="proj-desc">AI-assisted market analysis platform detecting candlestick</text>
    <text x="18" y="66" class="proj-desc">patterns and indicators with computer vision.</text>

    <!-- Footer: Stack & Action -->
    <rect x="18" y="94" width="220" height="24" rx="12" fill="#EAF2E8"/>
    <text x="28" y="110" class="proj-tag">Python &#8226; YOLOv5 &#8226; Django</text>

    <g transform="translate(290, 92)">
      <rect x="0" y="0" width="96" height="28" rx="7" fill="#24452E"/>
      <text x="48" y="18" class="btn-txt" text-anchor="middle">DEMO &#8599;</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- CELL 02: TOURCRAZE (Top-Right)                                      -->
  <!-- =================================================================== -->
  <g transform="translate(452, 60)">
    <rect x="0" y="0" width="404" height="138" rx="12" fill="url(#cellBg)" stroke="#DCE8D8" stroke-width="1.2"/>

    <!-- Header row -->
    <text x="18" y="26" class="proj-num">02</text>
    <text x="44" y="26" class="proj-title">TOURCRAZE</text>

    <!-- Mini Route Graph visual -->
    <g transform="translate(330, 16)">
      <line x1="8" y1="18" x2="26" y2="6" stroke="#4F7F5B" stroke-width="1.5"/>
      <line x1="26" y1="6" x2="42" y2="22" stroke="#4F7F5B" stroke-width="1.5"/>
      <circle cx="8" cy="18" r="3.5" fill="#4F7F5B"/>
      <circle cx="26" cy="6" r="4.5" fill="#24452E">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="22" r="3.5" fill="#9DB89B"/>
    </g>

    <text x="18" y="48" class="proj-desc">Smart travel planner and group expense manager with</text>
    <text x="18" y="66" class="proj-desc">TripSplit greedy settlement algorithm.</text>

    <!-- Footer: Stack & Action -->
    <rect x="18" y="94" width="220" height="24" rx="12" fill="#EAF2E8"/>
    <text x="28" y="110" class="proj-tag">Django &#8226; Python &#8226; JS &#8226; Graph</text>

    <g transform="translate(290, 92)">
      <rect x="0" y="0" width="96" height="28" rx="7" fill="#24452E"/>
      <text x="48" y="18" class="btn-txt" text-anchor="middle">DEMO &#8599;</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- CELL 03: GAADIMANDI (Bottom-Left)                                   -->
  <!-- =================================================================== -->
  <g transform="translate(24, 210)">
    <rect x="0" y="0" width="404" height="138" rx="12" fill="url(#cellBg)" stroke="#DCE8D8" stroke-width="1.2"/>

    <!-- Header row -->
    <text x="18" y="26" class="proj-num">03</text>
    <text x="44" y="26" class="proj-title">GAADIMANDI</text>

    <!-- Mini Gauge visual -->
    <g transform="translate(335, 14)">
      <path d="M 6,28 A 15,15 0 0,1 36,28" fill="none" stroke="#DCE8D8" stroke-width="2.5"/>
      <path d="M 6,28 A 15,15 0 0,1 28,16" fill="none" stroke="#4F7F5B" stroke-width="2.5"/>
      <circle cx="21" cy="28" r="2.5" fill="#24452E"/>
      <line x1="21" y1="28" x2="27" y2="18" stroke="#24452E" stroke-width="1.8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 21 28; 15 21 28; -10 21 28; 0 21 28" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="18" y="48" class="proj-desc">Automotive dealership marketplace with distributed vehicle</text>
    <text x="18" y="66" class="proj-desc">inventory management and instant inquiries.</text>

    <!-- Footer: Stack & Action -->
    <rect x="18" y="94" width="220" height="24" rx="12" fill="#EAF2E8"/>
    <text x="28" y="110" class="proj-tag">Django 5.x &#8226; PostgreSQL &#8226; REST</text>

    <g transform="translate(290, 92)">
      <rect x="0" y="0" width="96" height="28" rx="7" fill="#24452E"/>
      <text x="48" y="18" class="btn-txt" text-anchor="middle">DEMO &#8599;</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- CELL 04: PERSONAL PORTFOLIO (Bottom-Right)                          -->
  <!-- =================================================================== -->
  <g transform="translate(452, 210)">
    <rect x="0" y="0" width="404" height="138" rx="12" fill="url(#cellBg)" stroke="#DCE8D8" stroke-width="1.2"/>

    <!-- Header row -->
    <text x="18" y="26" class="proj-num">04</text>
    <text x="44" y="26" class="proj-title">PORTFOLIO</text>

    <!-- Mini 3D Cube visual -->
    <g transform="translate(340, 14)">
      <path d="M 18,4 L 32,11 L 18,18 L 4,11 Z" fill="#DCE8D8" stroke="#4F7F5B" stroke-width="0.8"/>
      <path d="M 4,11 L 18,18 L 18,32 L 4,25 Z" fill="#9DB89B" stroke="#4F7F5B" stroke-width="0.8"/>
      <path d="M 18,18 L 32,11 L 32,25 L 18,32 Z" fill="#4F7F5B" stroke="#24452E" stroke-width="0.8"/>
    </g>

    <text x="18" y="48" class="proj-desc">Creative digital laboratory exploring modern frontend craft,</text>
    <text x="18" y="66" class="proj-desc">interactive 3D graphics, and fluid micro-animations.</text>

    <!-- Footer: Stack & Action -->
    <rect x="18" y="94" width="220" height="24" rx="12" fill="#EAF2E8"/>
    <text x="28" y="110" class="proj-tag">Next.js &#8226; Three.js &#8226; Framer</text>

    <g transform="translate(290, 92)">
      <rect x="0" y="0" width="96" height="28" rx="7" fill="#24452E"/>
      <text x="48" y="18" class="btn-txt" text-anchor="middle">LIVE &#8599;</text>
    </g>
  </g>

  <!-- Continuous Flow Line Out -->
  <line x1="440" y1="362" x2="440" y2="375" stroke="#4F7F5B" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
