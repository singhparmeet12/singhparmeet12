<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Uniform Canvas Background -->
    <linearGradient id="c4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3" />
      <stop offset="100%" stop-color="#F6F8F3" />
    </linearGradient>

    <style>
      .sans-p {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-p {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Surface -->
  <rect width="900" height="360" fill="url(#c4Bg)" />

  <!-- Technical Grid Markers -->
  <line x1="60" y1="0" x2="60" y2="360" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="840" y1="0" x2="840" y2="360" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Continuous Spine Line Entrance -->
  <line x1="450" y1="0" x2="450" y2="30" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="30" r="3" fill="#4F7F5B" />

  <!-- Right Flowing Curve into GaadiMandi -->
  <path d="M 450 30 C 450 60, 800 50, 800 80" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />

  <!-- ======================================================================
       PROJECT 02: GAADIMANDI PRESENTATION (Alternated Asymmetrical Layout)
       ====================================================================== -->
  <!-- Left Side: Architectural Diagram / Pipeline Visual -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="340" height="235" rx="10" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />

    <!-- Visual Header Bar -->
    <rect x="0" y="0" width="340" height="28" rx="10" fill="#F0F5EE" />
    <rect x="0" y="20" width="340" height="8" fill="#F0F5EE" />
    <line x1="0" y1="28" x2="340" y2="28" stroke="#DCE8D8" stroke-width="0.75" />
    <circle cx="16" cy="14" r="3" fill="#4F7F5B" />
    <text x="28" y="18" class="mono-p" font-size="9" fill="#657066">inventory_architecture.py // MULTI-TENANT</text>

    <!-- System Architecture Graph Inside Card -->
    <!-- Node 1: Dealer Intake -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="90" height="34" rx="4" fill="#F6F8F3" stroke="#9DB89B" stroke-width="1" />
      <text x="8" y="15" class="mono-p" font-size="8.5" font-weight="700" fill="#24452E">DEALER CRM</text>
      <text x="8" y="27" class="mono-p" font-size="7.5" fill="#657066">Vehicle Intake</text>
    </g>

    <!-- Node 2: Media Pipeline -->
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="90" height="34" rx="4" fill="#F6F8F3" stroke="#9DB89B" stroke-width="1" />
      <text x="8" y="15" class="mono-p" font-size="8.5" font-weight="700" fill="#24452E">CLOUDINARY</text>
      <text x="8" y="27" class="mono-p" font-size="7.5" fill="#657066">Asset Delivery</text>
    </g>

    <!-- Node 3: Leads Routing -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="90" height="34" rx="4" fill="#F6F8F3" stroke="#9DB89B" stroke-width="1" />
      <text x="8" y="15" class="mono-p" font-size="8.5" font-weight="700" fill="#24452E">LEAD ENGINE</text>
      <text x="8" y="27" class="mono-p" font-size="7.5" fill="#657066">Routing Service</text>
    </g>

    <!-- Central Hub: Django 5 Core -->
    <g transform="translate(150, 90)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#DCE8D8" fill-opacity="0.4" stroke="#4F7F5B" stroke-width="1.2" />
      <text x="14" y="22" class="mono-p" font-size="9.5" font-weight="800" fill="#18231A">DJANGO 5.x</text>
      <text x="14" y="36" class="mono-p" font-size="8" fill="#4F7F5B">ORM / PIPELINES</text>
      <text x="14" y="49" class="mono-p" font-size="7.5" fill="#657066">PostgreSQL 16</text>
    </g>

    <!-- Right Node: Public Catalog -->
    <g transform="translate(265, 102)">
      <rect x="0" y="0" width="60" height="36" rx="4" fill="#F6F8F3" stroke="#24452E" stroke-width="1" />
      <text x="7" y="15" class="mono-p" font-size="8" font-weight="700" fill="#18231A">CLIENT UI</text>
      <text x="7" y="27" class="mono-p" font-size="7" fill="#4F7F5B">&lt; 0.4s load</text>
    </g>

    <!-- Connecting Data Paths -->
    <path d="M 110 67 L 150 105" stroke="#4F7F5B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 110 122 L 150 122" stroke="#4F7F5B" stroke-width="1" />
    <path d="M 110 177 L 150 138" stroke="#4F7F5B" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 250 120 L 265 120" stroke="#24452E" stroke-width="1.2" />
  </g>

  <!-- Right Side: Product Narrative -->
  <g transform="translate(460, 75)">
    <text x="0" y="20" class="mono-p" font-size="13" font-weight="700" fill="#4F7F5B" letter-spacing="0.1em">
      02 // PRODUCT
    </text>
    
    <text x="0" y="58" class="sans-p" font-size="34" font-weight="800" fill="#18231A" letter-spacing="-0.03em">
      GaadiMandi
    </text>

    <text x="2" y="82" class="mono-p" font-size="11.5" font-weight="600" fill="#657066" letter-spacing="0.08em">
      AUTOMOTIVE DEALERSHIP &amp; INVENTORY PLATFORM
    </text>

    <g class="sans-p" font-size="13" fill="#3D4A3F" line-height="1.55">
      <text x="2" y="118">Enterprise automotive inventory management platform.</text>
      <text x="2" y="138">Engineered with Django 5.x for multi-dealer inventory</text>
      <text x="2" y="158">partitioning, asynchronous vehicle search filters, and</text>
      <text x="2" y="178">Cloudinary-optimized media pipelines with automated leads.</text>
    </g>

    <g transform="translate(2, 216)" class="mono-p" font-size="10.5" fill="#4F7F5B" font-weight="600">
      <text x="0" y="0">STACK &#8226; Django 5.x &#8226; Python &#8226; PostgreSQL &#8226; Cloudinary &#8226; REST</text>
    </g>
  </g>

  <!-- Continuous Spine Line Exit -->
  <path d="M 390 320 C 390 345, 450 335, 450 360" fill="none" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="360" r="3" fill="#4F7F5B" />

</svg>
