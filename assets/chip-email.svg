<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 38" width="90" height="38">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="gl"/>
      <feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="88" height="36" rx="18" fill="#161b22" stroke="#39FF14" stroke-width="1.2" filter="url(#g)">
    <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="45" y="24" text-anchor="middle" font-family="'Consolas', 'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#98FFB8">Email</text>
</svg>