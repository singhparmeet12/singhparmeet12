<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Uniform Canvas Background -->
    <linearGradient id="c3Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3" />
      <stop offset="100%" stop-color="#F6F8F3" />
    </linearGradient>

    <style>
      .sans-p {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-p {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Canvas Surface -->
  <rect width="900" height="360" fill="url(#c3Bg)" />

  <!-- Technical Grid Markers -->
  <line x1="60" y1="0" x2="60" y2="360" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="840" y1="0" x2="840" y2="360" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Continuous Spine Line Entrance & Flow -->
  <line x1="450" y1="0" x2="450" y2="30" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="30" r="3" fill="#4F7F5B" />

  <!-- Left Flowing Branch into TradeLab -->
  <path d="M 450 30 C 450 60, 100 50, 100 80" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />

  <!-- ======================================================================
       PROJECT 01: TRADELAB PRESENTATION
       ====================================================================== -->
  <!-- Left Side: Product Specifications -->
  <g transform="translate(60, 75)">
    <!-- Project Index & Tag -->
    <text x="0" y="20" class="mono-p" font-size="13" font-weight="700" fill="#4F7F5B" letter-spacing="0.1em">
      01 // PRODUCT
    </text>
    
    <!-- Title -->
    <text x="0" y="58" class="sans-p" font-size="34" font-weight="800" fill="#18231A" letter-spacing="-0.03em">
      TradeLab
    </text>

    <!-- Subtitle Category -->
    <text x="2" y="82" class="mono-p" font-size="11.5" font-weight="600" fill="#657066" letter-spacing="0.08em">
      AI TRADING PLATFORM &amp; COMPUTER VISION
    </text>

    <!-- Project Description -->
    <g class="sans-p" font-size="13" fill="#3D4A3F" line-height="1.55">
      <text x="2" y="118">Automated financial chart pattern recognition platform.</text>
      <text x="2" y="138">Engineered a YOLOv5 computer vision model trained on</text>
      <text x="2" y="158">1,450+ annotated trading charts to detect 20 technical</text>
      <text x="2" y="178">patterns with custom TradingView Pine Script indicators.</text>
    </g>

    <!-- Stack Footprint -->
    <g transform="translate(2, 216)" class="mono-p" font-size="10.5" fill="#4F7F5B" font-weight="600">
      <text x="0" y="0">STACK &#8226; Python &#8226; Django &#8226; YOLOv5 &#8226; Pine Script &#8226; OpenCV &#8226; Pandas</text>
    </g>
  </g>

  <!-- Right Side: Stylized Technical Visual Artifact -->
  <g transform="translate(510, 70)">
    <!-- Visual Canvas Pane -->
    <rect x="0" y="0" width="330" height="235" rx="10" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    
    <!-- Visual Header Bar -->
    <rect x="0" y="0" width="330" height="28" rx="10" fill="#F0F5EE" />
    <rect x="0" y="20" width="330" height="8" fill="#F0F5EE" />
    <line x1="0" y1="28" x2="330" y2="28" stroke="#DCE8D8" stroke-width="0.75" />
    <circle cx="16" cy="14" r="3" fill="#9DB89B" />
    <circle cx="28" cy="14" r="3" fill="#DCE8D8" />
    <text x="44" y="18" class="mono-p" font-size="9" fill="#657066">cv_pattern_detector.py &#8226; MODEL: YOLOv5s</text>

    <!-- Chart Canvas & Grid Lines -->
    <g stroke="#E8F1E7" stroke-width="0.75">
      <line x1="20" y1="60" x2="310" y2="60" />
      <line x1="20" y1="105" x2="310" y2="105" />
      <line x1="20" y1="150" x2="310" y2="150" />
      <line x1="20" y1="195" x2="310" y2="195" />
      <line x1="80" y1="35" x2="80" y2="215" />
      <line x1="160" y1="35" x2="160" y2="215" />
      <line x1="240" y1="35" x2="240" y2="215" />
    </g>

    <!-- Candlestick Visual Abstractions -->
    <g fill="#4F7F5B" stroke="#4F7F5B">
      <!-- Bullish green candles -->
      <line x1="45" y1="130" x2="45" y2="175" stroke-width="1" />
      <rect x="41" y="140" width="8" height="25" rx="1" />

      <line x1="75" y1="110" x2="75" y2="160" stroke-width="1" />
      <rect x="71" y="120" width="8" height="30" rx="1" />

      <!-- Bearish soft candles -->
      <line x1="115" y1="95" x2="115" y2="150" stroke="#9DB89B" stroke-width="1" />
      <rect x="111" y="105" width="8" height="35" fill="#9DB89B" rx="1" />

      <!-- Pattern formation -->
      <line x1="155" y1="125" x2="155" y2="185" stroke-width="1" />
      <rect x="151" y="135" width="8" height="40" rx="1" />

      <line x1="195" y1="90" x2="195" y2="145" stroke-width="1" />
      <rect x="191" y="100" width="8" height="35" rx="1" />

      <line x1="235" y1="65" x2="235" y2="120" stroke-width="1" />
      <rect x="231" y="75" width="8" height="35" rx="1" />

      <line x1="275" y1="50" x2="275" y2="105" stroke-width="1" />
      <rect x="271" y="58" width="8" height="38" rx="1" />
    </g>

    <!-- Flowing Moving Average Indicator Line -->
    <path d="M 30 170 C 90 150, 150 160, 210 110 S 280 60, 310 52" fill="none" stroke="#24452E" stroke-width="1.8" />

    <!-- AI Bounding Box Detection Overlay -->
    <rect x="135" y="85" width="165" height="115" rx="4" fill="#DCE8D8" fill-opacity="0.25" stroke="#4F7F5B" stroke-width="1.2" stroke-dasharray="3 3" />
    <g transform="translate(140, 97)" class="mono-p" font-size="8.5" font-weight="700">
      <rect x="0" y="-8" width="138" height="15" rx="2" fill="#4F7F5B" />
      <text x="4" y="3" fill="#FBFCF8">DOUBLE BOTTOM // 94.2%</text>
    </g>
  </g>

  <!-- Continuous Spine Line Exit -->
  <path d="M 510 320 C 510 345, 450 335, 450 360" fill="none" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="360" r="3" fill="#4F7F5B" />

</svg>
