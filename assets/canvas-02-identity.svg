<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Master Background: Uniform #F6F8F3 -->
    <linearGradient id="c2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8F3" />
      <stop offset="100%" stop-color="#F6F8F3" />
    </linearGradient>

    <style>
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .mono-tech {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Surface -->
  <rect width="900" height="280" fill="url(#c2Bg)" />

  <!-- Technical Grid Markers -->
  <line x1="60" y1="0" x2="60" y2="280" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="840" y1="0" x2="840" y2="280" stroke="#DCE8D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- ======================================================================
       CONTINUOUS SPINE LINE SYSTEM
       ====================================================================== -->
  <!-- Enters at x=450, y=0 -->
  <line x1="450" y1="0" x2="450" y2="35" stroke="#4F7F5B" stroke-width="1.2" />
  <circle cx="450" cy="35" r="3.5" fill="#4F7F5B" />

  <!-- Bifurcation Curves: Splits to Left (x=250) and Right (x=650) -->
  <path d="M 450 35 C 450 70, 250 60, 250 100" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 450 35 C 450 70, 650 60, 650 100" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Left Focus Pillar -->
  <g transform="translate(90, 80)">
    <rect x="0" y="0" width="330" height="135" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="20" y="28" class="mono-tech" font-size="11" font-weight="700" fill="#4F7F5B" letter-spacing="0.1em">
      01 // ARCHITECTURAL RIGOR
    </text>
    <text x="20" y="56" class="sans-text" font-size="12.5" fill="#18231A" font-weight="600">
      Backend Systems &amp; Relational Schemas
    </text>
    <g class="sans-text" font-size="12" fill="#657066" line-height="1.5">
      <text x="20" y="80">Scalable Python and Django 5.x foundations,</text>
      <text x="20" y="98">PostgreSQL query tuning, and sub-second</text>
      <text x="20" y="116">RESTful API micro-services with zero bloat.</text>
    </g>
  </g>

  <!-- Right Focus Pillar -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="330" height="135" rx="8" fill="#FBFCF8" stroke="#DCE8D8" stroke-width="1" />
    <text x="20" y="28" class="mono-tech" font-size="11" font-weight="700" fill="#4F7F5B" letter-spacing="0.1em">
      02 // DATA &amp; USER EXPERIENCE
    </text>
    <text x="20" y="56" class="sans-text" font-size="12.5" fill="#18231A" font-weight="600">
      Applied AI &amp; Modern Frontends
    </text>
    <g class="sans-text" font-size="12" fill="#657066" line-height="1.5">
      <text x="20" y="80">Computer vision chart pattern recognition (YOLOv5),</text>
      <text x="20" y="98">greedy graph debt settlement algorithms, and</text>
      <text x="20" y="116">refined, responsive interactive interfaces.</text>
    </g>
  </g>

  <!-- Convergence Curves: Reconnects at bottom x=450, y=280 -->
  <path d="M 250 215 C 250 255, 450 245, 450 280" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 650 215 C 650 255, 450 245, 450 280" fill="none" stroke="#9DB89B" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="450" cy="280" r="3.5" fill="#4F7F5B" />

</svg>
